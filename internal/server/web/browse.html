<script>
// An optional host background, the same hook setup.html and lemmas.html carry:
// the Android host paints the chosen image (or colour) behind a transparent
// WebView, and this is what tells the page it is there, before the first paint.
// Session storage preserves it across page reloads; an explicit empty URL
// value withdraws it on the next launch.
//
// This page is reached by TAPPING A LINK, so it never carries the shell_* URL
// parameters itself - sessionStorage, written by the hook on the app page, is
// the path that actually fires here. The parameter half is kept because it is
// what the two sibling pages spell and because a reload of a page that was
// opened with them must not lose them.
window.wudictShellBackground = function (color, image, imageName, paper) {
  var root = document.documentElement;
  root.toggleAttribute('data-shell-image', !!image);
  var file = imageName;
  if (file === undefined) try { file = sessionStorage.getItem('wudict_shell_image_name'); } catch (_) {}
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/.test(file || '')) file = '';
  root.style.setProperty('--paper-bk-image', image && file ? 'url("/files/' + file + '")' : 'none');
  try { root.toggleAttribute('data-desktop-image', !!image && !!file && sessionStorage.getItem('wudict_desktop_image') === '1'); } catch (_) {}
  // The paper an enabled PRESET paints, handed here by the app page: that page
  // paints this paper with its own layer and does not wear it as a shell
  // colour, while this document - no layers of its own - has nothing but the
  // host to give it a ground. It arrives with every call, and it is also kept
  // in wudict_shell_paper, because this page is reached by tapping a link and
  // so carries no shell parameters of its own. The READER's own colour wins
  // when there is one: that is the colour the app page paints as well.
  if (!/^#[0-9a-f]{6}$/i.test(color) && /^#[0-9a-f]{6}$/i.test(paper || '')) color = paper;
  var valid = /^#[0-9a-f]{6}$/i.test(color);
  root.toggleAttribute('data-shell-custom', valid || !!image);
  if (valid) {
    var rgb = color.slice(1).match(/../g).map(function (v) { return parseInt(v, 16); });
    root.setAttribute('data-shell-tone', rgb[0] * .299 + rgb[1] * .587 + rgb[2] * .114 > 160 ? 'light' : 'dark');
  } else root.removeAttribute('data-shell-tone');
  if (valid) root.style.setProperty('--bg', color, 'important');
  else root.style.removeProperty('--bg');
  try {
    if (image) sessionStorage.setItem('wudict_shell_image', '1');
    else sessionStorage.removeItem('wudict_shell_image');
    if (valid) sessionStorage.setItem('wudict_shell_bg', color);
    else sessionStorage.removeItem('wudict_shell_bg');
    if (paper !== undefined) {
      if (/^#[0-9a-f]{6}$/i.test(paper || '')) sessionStorage.setItem('wudict_shell_paper', paper);
      else sessionStorage.removeItem('wudict_shell_paper');
    }
  } catch (_) {}
};
(function () {
  var params = new URLSearchParams(location.search);
  var color = params.get('shell_bg');
  var image = params.get('shell_image');
  var paper = params.get('shell_paper');
  if (params.has('shell_bg') || params.has('shell_paper') || params.has('shell_image')) {
    params.delete('shell_bg');
    params.delete('shell_paper');
    params.delete('shell_image');
    var query = params.toString();
    history.replaceState(history.state, '', location.pathname + (query ? '?' + query : '') + location.hash);
  }
  if (color === null) {
    try { color = sessionStorage.getItem('wudict_shell_bg'); } catch (_) {}
  }
  if (image === null) {
    try { image = sessionStorage.getItem('wudict_shell_image'); } catch (_) {}
  }
  if (paper === null) {
    try { paper = sessionStorage.getItem('wudict_shell_paper'); } catch (_) {}
  }
  window.wudictShellBackground(color || '', image === '1', undefined, paper || '');
})();
</script>

<!--
 Copyright (C) 2026 glowinthedark

 SPDX-License-Identifier: GPL-3.0-or-later

 The reading view: a dictionary as a list of its own words, turned a page at a
 time, the way one is read on paper. Its bottom search uses the prepared
 headword index and can navigate the full list or filter it into result pages.
 That is why it is a separate page rather than a mode of the app: everything
 the app carries to make an answer possible is dead weight here, and the one
 thing this needs (a stable address for a PLACE in the list) the app has no
 spelling for.

 The ordinary reading position is in the URL - ?dict=<id>&p=<n> - so its
 pages remain bookmarkable and walkable with Back. The chooser adds
 chooser=1, which gives Close a stable destination after page turns. The
 bottom search is a temporary view over the same headword index.

 It is deliberately not a client of setup.css: that stylesheet centres a single
 card in the viewport, which is the opposite of a full-bleed list.
-->
<style>
:root{
  --bg:#fbfaf8; --bar:rgba(251,250,248,.94); --fg:#2b2a28; --soft:#6d6a64;
  --faint:#a5a19a; --accent:#e08600; --line:#e8e4dd; --line-soft:#f1eee8;
  --link:#5b7a99; --focus:#7aa7d1;
  /* The label register (app.css and setup.css say what it is for): every
     label, count and hint here reads --label / --label-quiet, whose default is
     the ink, and the two aliases let ONE preset file — the same one the app
     page links — resolve on this page too. */
  --label:var(--fg); --label-quiet:var(--fg);
  --fg-soft:var(--soft); --fg-faint:var(--faint);
}
/* Same three-way spelling the app uses: the OS preference, unless the reader
   pinned a theme in the app (wudict_theme, read once at boot). */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#191a1c; --bar:rgba(25,26,28,.94); --fg:#d8d5d0; --soft:#96938d;
  --faint:#5f5c57; --accent:#e69a33; --line:#33363b; --line-soft:#2a2c30;
  --link:#8fb0cc; --focus:#7aa7d1;
}}
:root[data-theme=dark]{
  --bg:#191a1c; --bar:rgba(25,26,28,.94); --fg:#d8d5d0; --soft:#96938d;
  --faint:#5f5c57; --accent:#e69a33; --line:#33363b; --line-soft:#2a2c30;
  --link:#8fb0cc; --focus:#7aa7d1;
}
@media (hover:hover){
  *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--fg) 38%,transparent) transparent}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 38%,transparent);
    border:2px solid transparent;background-clip:padding-box;border-radius:10px}
  *::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--fg) 62%,transparent)}
}
/* ── the host background ────────────────────────────────────────────────
   The Android host paints the chosen colour — and the wallpaper, when one is
   set — behind a transparent WebView, and the hook above says so before the
   first paint. Spelled the way setup.html and lemmas.html spell it: the page
   goes transparent, its surfaces stay translucent, and the palette follows the
   TONE of the colour the host sent rather than this page's own light/dark rule
   — a reader who chose a light paper must not be handed light text on it. */
html[data-shell-image], html[data-shell-image] body { background:transparent !important; }
html[data-desktop-image] { background-color:var(--bg) !important;background-image:var(--paper-bk-image) !important;background-size:100% 100% !important;background-attachment:fixed !important; }
/* The bar is glass over the wallpaper rather than an opaque band across it:
   the blur stays, the 94% fill goes. Hover fills go the same way, or a row
   turns into a white stripe lying on a dark paper. */
html[data-shell-custom] { --bar:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.2); }
html[data-shell-custom] .msg { background:rgba(255,255,255,.14); }
html[data-shell-custom] .browse-search-input { background:rgba(255,255,255,.18); }
/* html:root, not a bare html: alone it is (0,1,1) and a bare :root[tone] is
   (0,2,0) — either ties or loses against the two dark blocks above, and the
   tone MUST win, because it describes the surface the text actually sits on.
   The type selector is what settles it at (0,2,1). */
html:root[data-shell-tone="light"]{
  color-scheme:light; --fg:#2b2a28; --soft:#625b4d; --faint:#766e60;
  --line:rgba(89,75,56,.45); --accent:#865000; --link:#4d6b86; --focus:#7aa7d1;
}
html:root[data-shell-tone="dark"]{
  color-scheme:dark; --fg:#f4f1eb; --soft:#ded8cc; --faint:#c6beaf;
  --line:rgba(230,220,201,.45); --accent:#ffc773; --link:#a9c9e4; --focus:#7aa7d1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,
  "Segoe UI",Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bar);
  backdrop-filter:saturate(1.6) blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem .9rem .45rem}
.back{display:inline-flex;color:var(--label);padding:.25rem;border-radius:7px;text-decoration:none}
.back:hover{color:var(--accent);background:var(--line-soft)}
.back svg{width:18px;height:18px}
/* The title block takes the row on a wide screen and yields it on a narrow
   one: flex-wrap does the whole responsive job, with no media query to keep
   in step with the column count below. */
.title{display:flex;align-items:center;gap:.5rem;flex:1 1 13rem;min-width:0}
.title-copy{flex:1;min-width:0}
.title b{display:block;font-size:calc(var(--ui-font-title) * 1rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title b.two-line{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  white-space:normal;overflow-wrap:anywhere}
/* The running head, exactly as a printed page carries it: the first and last
   word ON THIS PAGE. It is the one thing that tells a reader where they are
   without counting. */
.title span{display:block;font-size:calc(var(--ui-hint-font-size) * 1rem);color:var(--label-quiet);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.title button{box-sizing:border-box;display:grid;place-items:center;flex:none;
  width:calc(var(--ui-main-control-height) * 1em);
  height:calc(var(--ui-main-control-height) * 1em);padding:0;
  font-size:calc(var(--ui-main-control-font) * 1rem);line-height:1;
  color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.title button svg,.chooser-head button svg{display:block;width:1.3em;height:1.3em}
.nav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;
  gap:.35rem;width:100%;flex:1 0 100%;font-size:calc(var(--ui-font-addition) * 1rem);color:var(--label)}
.nav button{box-sizing:border-box;font-family:inherit;
  font-size:calc(var(--ui-control-font) * 1rem);background:none;border:1px solid var(--line);color:var(--label);
  border-radius:8px;min-height:calc(var(--ui-control-height) * 1em);
  max-width:100%;padding:.2em .55em;line-height:1.1;cursor:pointer}
.nav button:first-child{justify-self:start}
.nav button:last-child{justify-self:end}
.nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav button:disabled{opacity:.3;cursor:default}
.nav b{justify-self:center;font-size:calc(var(--ui-font-addition) * 1rem);font-weight:600;color:var(--fg);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.nav [data-pos]{padding:.2em .55em;border:1px solid var(--line);border-radius:8px;min-height:calc(var(--ui-control-height) * 1em);background:var(--bar);color:inherit;font:inherit;cursor:pointer}
.nav [data-pos]:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav [data-pos]:disabled{opacity:.45;cursor:default}
.nav [data-pos]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
dialog.browse-goto{position:fixed;inset:0;margin:auto;box-sizing:border-box;width:min(420px,calc(100vw - 32px));height:fit-content;max-height:80dvh;padding:1em;
  border:1px solid var(--line);border-radius:12px;color:var(--fg);background:var(--bg);box-shadow:0 8px 32px #0004;z-index:20;font-size:calc(var(--ui-font-base) * 1rem)}
dialog.browse-goto:not([open]){display:none}
dialog.browse-goto[open]{display:block}
dialog.browse-goto::backdrop{background:rgba(0,0,0,.42)}
.browse-goto form{display:flex;flex-direction:column;gap:.75em}
.browse-goto h2{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin:0;font-size:calc(var(--ui-font-title) * 1rem)}
.browse-goto .close{box-sizing:border-box;display:grid;place-items:center;flex:none;width:calc(var(--ui-main-control-height) * 1em);height:calc(var(--ui-main-control-height) * 1em);padding:0;
  border:0;background:transparent;color:var(--fg);font-size:calc(var(--ui-main-control-font) * 1rem);line-height:1;cursor:pointer}
.browse-goto .close svg{display:block;width:1.3em;height:1.3em}
.browse-goto .goto-field{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.5em}
.browse-goto .goto-field label{font-size:calc(var(--ui-font-base) * 1rem);white-space:nowrap}
.browse-goto input{box-sizing:border-box;width:100%;height:calc(var(--ui-control-height) * 1em);padding:0 .45em;border:1px solid var(--line);border-radius:5px;
  color:var(--fg);background:var(--bg);font:inherit;font-size:calc(var(--ui-font-base) * 1rem)}
.browse-goto .range{grid-column:2;margin:-.45em 0 0;color:var(--label-quiet);font-size:calc(var(--ui-font-base) * 1rem);text-align:center}
.browse-goto .actions{display:flex;justify-content:space-between;gap:.5em;margin-top:.25em}
.browse-goto .actions button{min-height:calc(var(--ui-control-height) * 1em);padding:.2em .7em;border:1px solid var(--line);border-radius:8px;
  color:var(--fg);background:transparent;font:inherit;cursor:pointer}
.browse-goto .actions button[type=submit]{border-color:var(--line);background:color-mix(in srgb,var(--bg) 84%,var(--accent));color:var(--fg)}
html:is([data-shell-sepia],[data-shell-image]) .browse-goto input{background-color:var(--paper-bg,var(--bg))}
html[data-shell-image] dialog.browse-goto{background-image:var(--paper-bk-image);background-size:100% 100%;background-position:center;background-repeat:no-repeat}

/* One row, scrolled sideways rather than wrapped: wrapping a Cyrillic+Latin
   alphabet is four rows of chrome above every page, on the screen that can
   least afford it. The active chip is scrolled into view, so the strip is
   never scrolled to a place the reader is not. */
.strip-wrap{display:flex;align-items:stretch;gap:.1rem;padding:0 .35rem .4rem}
.strip-scrollbar{position:relative;height:12px;margin:0 .65rem .35rem;border-radius:99px;background:color-mix(in srgb,var(--fg) 12%,transparent);touch-action:none;cursor:pointer}
.strip-scroll-thumb{position:absolute;top:2px;left:0;height:8px;min-width:20px;border-radius:99px;background:color-mix(in srgb,var(--fg) 42%,var(--bg));cursor:grab;touch-action:none}
.strip-scrollbar:active .strip-scroll-thumb{cursor:grabbing}
.strip{display:block;position:relative;flex:1;min-width:0;column-gap:.1rem;overflow-x:auto;padding:0;scrollbar-width:none;
  overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.strip-track{position:relative;height:100%;min-width:100%}
.strip button.strip-chip{position:absolute;top:50%;transform:translateY(-50%);margin:0;min-width:0}
.strip button.strip-measure{position:absolute!important;left:0!important;top:0!important;visibility:hidden!important;pointer-events:none!important}
.strip button{font:inherit;font-size:calc(var(--ui-font-addition) * 1rem);line-height:1;background:none;border:0;color:var(--label);
  cursor:pointer;padding:.36rem .5rem;border-radius:7px;flex:0 0 auto;min-width:1.85rem;text-align:center}
.strip button.strip-chip{box-sizing:border-box;max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip button:hover{background:var(--line-soft);color:var(--fg)}
.strip button[aria-current=true]{background:var(--accent);color:#fff}

/* The whole responsive story, in one declaration: column-width is a request,
   not a count, so the browser fits as many 14rem columns as the viewport
   holds and drops to one when it holds one. Nothing to recompute on resize. */
.words{columns:14rem;column-gap:2.2rem;column-rule:1px solid var(--line-soft);
  max-width:1700px;margin:0 auto;padding:.9rem 1rem 2rem}
.words a{display:block;font-size:calc(var(--ui-font-addition) * 1rem);color:var(--link);text-decoration:none;padding:.16rem .3rem;
  border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;break-inside:avoid}
.words a:hover{background:var(--line-soft);color:var(--fg)}
.words a:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.words a.browse-find-anchor{outline:2px solid var(--accent);outline-offset:-2px;background:var(--line-soft)}
.words a{-webkit-touch-callout:none}
.browse-word-context-menu{position:fixed;z-index:1200;min-width:12em;padding:.25em;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);box-shadow:0 4px 18px #0003}
.browse-word-context-menu[hidden]{display:none}
.browse-word-context-menu button{display:block;width:100%;padding:.55em .8em;border:0;border-radius:5px;
  background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.browse-word-context-menu button:hover,.browse-word-context-menu button:focus-visible{background:var(--line-soft)}

main{padding-bottom:5rem}
footer{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;
  padding:.5rem .9rem max(.5rem,env(safe-area-inset-bottom));background:var(--bar);
  backdrop-filter:saturate(1.6) blur(8px);border-top:1px solid var(--line)}
body.browse-page-busy #top,body.browse-page-busy main,body.browse-page-busy .browse-search-dock{pointer-events:none;opacity:.62}
body.browse-page-busy #findInput{pointer-events:auto}
footer .browse-controls{width:100%;max-width:54rem}
footer .browse-search-dock{width:100%;max-width:54rem}
.words a.browse-current{outline:2px solid var(--accent);outline-offset:-2px;background:var(--line-soft)}
.words mark.browse-letter-match{background:var(--accent);color:var(--bg);border-radius:.15em}

.msg{max-width:34rem;margin:4rem auto;padding:1.4rem 1.6rem;background:var(--bg);
  border:1px solid var(--line);border-radius:12px}
.msg b{display:block;font-size:16px;margin-bottom:.3rem}
.msg p{margin:.3rem 0;color:var(--label);font-size:14px}
.msg a{color:var(--accent)}
.picks{display:flex;flex-direction:column;gap:.1rem;margin-top:.8rem}
.picks a{color:var(--link);text-decoration:none;padding:.3rem .4rem;border-radius:6px}
.picks a:hover{background:var(--line-soft);color:var(--fg)}
.picks span{color:var(--label-quiet)}
.chooser-head{display:flex;align-items:center;gap:.5em}
.chooser-list .chooser-hint{padding-bottom:.65em;margin-bottom:.5em;border-bottom:1px solid var(--line)}
.msg .chooser-head b{flex:1;min-width:0;margin:0;font-size:calc(var(--ui-font-title) * 1rem)}
.chooser-head button{box-sizing:border-box;display:grid;place-items:center;flex:none;
  width:calc(var(--ui-main-control-height) * 1em);
  height:calc(var(--ui-main-control-height) * 1em);padding:0;
  font-size:calc(var(--ui-main-control-font) * 1rem);line-height:1;
  color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.msg .chooser-hint{font-size:calc(var(--ui-hint-font-size) * 1rem)}
.picks a{display:flex;align-items:baseline;gap:.4em;font-size:calc(var(--ui-font-base) * 1rem)}
.picks span{flex:none;margin-left:auto;font-size:calc(var(--ui-hint-font-size) * 1rem)}
.picks .pick-name{flex:1;min-width:0;margin:0;font-size:inherit;overflow-wrap:anywhere}
.msg.chooser-list{box-sizing:border-box;display:flex;flex-direction:column;
  min-height:0;margin:1rem auto;max-height:calc(100dvh - 2rem)}
.chooser-list .chooser-head,.chooser-list .chooser-hint{flex:none}
.chooser-list .picks{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.chooser-list .list-search-dock{box-sizing:border-box;display:flex;align-items:center;
  gap:.25em;flex:none;margin-top:.5em;padding:.5em 0 0;border-top:1px solid var(--line);
  font-size:calc(var(--ui-edit_control-font) * 1rem)}
html[data-desktop-image] .chooser-list .chooser-hint{
  border-bottom-color:color-mix(in srgb,var(--fg) 28%,transparent)}
html[data-desktop-image] .chooser-list .list-search-dock{
  border-top-color:color-mix(in srgb,var(--fg) 28%,transparent)}
.chooser-list .list-search-input{box-sizing:border-box;flex:1 1 auto;min-width:0;width:0;
  height:calc(var(--ui-edit_control-height) * 1.5rem);margin:0;padding:0 .4em;
  font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);
  border-radius:6px;outline:none;-webkit-appearance:none}
.chooser-list .list-search-count{flex:none;min-width:2.5em;text-align:center;
  font-size:calc(var(--ui-font-addition) * 1rem);font-variant-numeric:tabular-nums;white-space:nowrap}
.chooser-list :is(.list-search-mode,.list-search-step){box-sizing:border-box;display:grid;
  place-items:center;flex:none;width:calc(var(--ui-edit_control-height) * 1.5rem);
  height:calc(var(--ui-edit_control-height) * 1.5rem);padding:0;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;line-height:1;cursor:pointer}

async function browseFetch(url,options={}){
  if(window.wudictAndroidGo){
    const requestURL=new URL(url,location.href);
    if(requestURL.origin===location.origin&&(options.method||"GET").toUpperCase()==="GET"){
      const params=requestURL.searchParams;
      if(requestURL.pathname==="/api/browse"&&params.get("stream")==="1")
        return androidBrowseStream("browse",params.toString(),options.signal);
      if(requestURL.pathname==="/api/browse"){
        const result=JSON.parse(window.wudictAndroidGo.browsePage(params.toString()));
        return {status:result.status,ok:result.status>=200&&result.status<300,json:async()=>result.body};
      }
      if(requestURL.pathname==="/api/browse/find"&&params.get("stream")==="1")
        return androidBrowseStream("browseFind",params.toString(),options.signal);
    }
    throw new Error("Browse operation is not connected to the Go bridge");
  }
  if(typeof window.wudictNativeCall!=="function")return fetch(url,options);
  const requestURL=new URL(url,location.href);
  if(requestURL.origin!==location.origin)return fetch(url,options);
  const method=(options.method||"GET").toUpperCase(),params=requestURL.searchParams;
  if(requestURL.pathname==="/api/browse"&&method==="GET"){

    return {status:result.status,ok:result.status>=200&&result.status<300,json:async()=>result.body};
  }

    return nativeBrowseStream("browseFind",params.toString(),options.signal);

function androidBrowseStream(method,query,signal){
  const encoder=new TextEncoder();
  let id=0,stopped=false;
  const stop=()=>{stopped=true;if(id>0)window.wudictAndroidGo.cancelDictStream(id)};
  const body=new ReadableStream({start(controller){
    if(signal?.aborted){controller.error(new DOMException("Aborted","AbortError"));return}
    id=window.wudictAndroidGo.startBrowseStream(method,query);
    if(id<=0){controller.error(new Error("Go runtime is unavailable"));return}
    const abort=()=>{stop();controller.error(new DOMException("Aborted","AbortError"))};
    if(signal)signal.addEventListener("abort",abort,{once:true});
    (async()=>{
      try{
        for(;;){
          if(stopped)throw new DOMException("Aborted","AbortError");
          const packet=JSON.parse(window.wudictAndroidGo.pollDictStream(id));
          for(const message of packet.messages||[]){
            if(stopped)throw new DOMException("Aborted","AbortError");
            controller.enqueue(encoder.encode(JSON.stringify(message)+"\n"));
          }
          if(packet.done){if(packet.error)throw new Error(packet.error);controller.close();return}
          await new Promise(resolve=>setTimeout(resolve,16));

      }catch(error){if(!stopped)controller.error(error)}
      finally{if(signal)signal.removeEventListener("abort",abort);stop()}
    })();
  },cancel(){stop()}});
  return {status:200,ok:true,body};
}

  const body=new ReadableStream({start(controller){
    window.wudictNativeCall(method,query,message=>controller.enqueue(encoder.encode(JSON.stringify(message)+"\n")),signal)
      .then(()=>controller.close()).catch(error=>controller.error(error));
  }});
  return {status:200,ok:true,body};
}
async function androidChooserDicts(){
  const id=window.wudictAndroidGo.startDictStream();
  if(id<=0)throw new Error("Go runtime is unavailable");
  const rows=[];
  try{
    for(;;){
      const packet=JSON.parse(window.wudictAndroidGo.pollDictStream(id));
      for(const message of packet.messages||[])
        if(message.t==="dict"&&message.dict&&!message.dict.error)rows.push(message.dict);
      if(packet.done){if(packet.error)throw new Error(packet.error);return rows}
      await new Promise(resolve=>setTimeout(resolve,16));
    }
  }finally{window.wudictAndroidGo.cancelDictStream(id)}

function restoreBrowseAlphabet(dict){

      browseTrace("alphabet cache miss",{dict,readMs:Math.round(performance.now()-started),bytes});return;
    }
    const letters=saved.letters.map(item=>({l:item[0],o:item[1],n:item[2]}));
    if(letters.some(item=>typeof item.l!=="string"||!Number.isSafeInteger(item.o)||!Number.isSafeInteger(item.n))){

    stripMeasureGeneration++;stripMeasureStarted=0;stripMeasureStartCount=0;stripMeasureChunks=0;

  let at=0;for(const ch of w){starts.push(at);at+=ch.length}
  const failed=new Set();
  function walk(pi,wi){
    const key=pi+":"+wi;if(failed.has(key))return null;
    if(pi===p.length)return wi===w.length?[]:null;
    if(p[pi]==="*"){
      for(let end=wi;end<=w.length;end++){
        const tail=walk(pi+1,end);if(tail)return tail;
      }
    }else if(wi<w.length){
      const matches=p[pi]==="?"||foldFind(p[pi])===foldFind(w[wi]);
      const tail=matches?walk(pi+1,wi+1):null;
      if(tail){
        if(p[pi]==="?")return tail;
        return [[starts[wi],starts[wi]+w[wi].length],...tail];
      }
    }
    failed.add(key);return null;
  }
  const ranges=walk(0,0);
  if(!ranges)return null;
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged=[];
  for(const [start,end] of ranges){
    if(merged.length&&start<=merged[merged.length-1][1])merged[merged.length-1][1]=Math.max(end,merged[merged.length-1][1]);
    else merged.push([start,end]);
  }
  return merged;
}
function highlightedWord(word,ranges){
  if(!ranges)return esc(word);
  let from=0,html="";
  for(const [start,end] of ranges){
    html+=esc(word.slice(from,start))+'<mark class="browse-letter-match">'+esc(word.slice(start,end))+"</mark>";
    from=end;
  }
  return html+esc(word.slice(from));
}

function fitTitle(){
  const name=$("name");
  if(!name.textContent||!name.clientWidth)return;
  const root=getComputedStyle(document.documentElement);
  const rem=parseFloat(root.fontSize)||16;
  const title=(parseFloat(root.getPropertyValue("--ui-font-title"))||1.15)*rem;
  const addition=(parseFloat(root.getPropertyValue("--ui-font-addition"))||.9)*rem;
  const minimum=Math.min(title,addition);
  name.classList.remove("two-line");
  name.style.fontSize=title+"px";
  if(name.scrollWidth<=name.clientWidth+1)return;
  let size=Math.min(title,title*name.clientWidth/name.scrollWidth);
  if(size>=minimum){
    name.style.fontSize=size+"px";
    while(name.scrollWidth>name.clientWidth+1&&size>minimum){
      size=Math.max(minimum,size-.25);
      name.style.fontSize=size+"px";
    }
    if(name.scrollWidth<=name.clientWidth+1)return;
  }
  name.style.fontSize=minimum+"px";
  name.classList.add("two-line");
}

  const anchorUpper=findAnchorWord?browseFindUpperBound(findAnchorWord):-1;
  const count=findAnchorWord?anchorLower:findIndex+1;
  browseHeadwordControl.paint({filtering,mask:findMask,applyRequired:browseNeedsApply(),
    applyEnabled:!!$("findInput").value.trim(),busy:locked,allowInputWhileBusy:true,

    countLabel:t("browse.gotoMatch"),

function browseCompareWords(a,b){
  const left=new TextEncoder().encode(String(a).replace(/[A-Z]/g,c=>c.toLowerCase()));
  const right=new TextEncoder().encode(String(b).replace(/[A-Z]/g,c=>c.toLowerCase()));
  const length=Math.min(left.length,right.length);
  for(let i=0;i<length;i++)if(left[i]!==right[i])return left[i]-right[i];
  return left.length-right.length;
}
function browseFindLowerBound(word){
  let lo=0,hi=findStreamWords.length;
  while(lo<hi){const mid=(lo+hi)>>>1;if(browseCompareWords(findStreamWords[mid],word)<0)lo=mid+1;else hi=mid}
  return lo;
}
function browseFindUpperBound(word){
  let lo=0,hi=findStreamWords.length;
  while(lo<hi){const mid=(lo+hi)>>>1;if(browseCompareWords(findStreamWords[mid],word)<=0)lo=mid+1;else hi=mid}
  return lo;
}
async function fetchFound(page,target=0,record="replace"){
  // A delayed input callback or navigation must not bypass Apply in any mode.
  if(findAwaitingApply())return;
  findAbort?.abort();
  const controller=new AbortController();findAbort=controller;
  const seq=++findSeq,query=$("findInput").value.trim(),mask=appliedFindMask;
  findStreamDone=false;findStreamWords=[];findFilterPage=1;findPendingMove=0;findPendingPage=page>1?page:0;
  findResult={words:findStreamWords,total:0,page:1,pages:0,size:300,stream:true};
  updateFindControls();render();
  const endProgress=browseProgress(t(findFilter?"browse.filteringWords":"browse.searchingWords"),()=>controller.abort(),"find");
  // This closure owns only this request's task, including after a newer query starts.
  const finish=()=>endProgress();
  const u=new URLSearchParams({dict:dictId,q:query,wildcards:mask?"1":"0",stream:"1"});
  if(browseDiagnosticsEnabled())u.set("diagnostics","1");
  try{
    const r=await browseFetch("/api/browse/find?"+u,{signal:controller.signal});
    if(!r.ok){const body=await r.json().catch(()=>({}));throw new Error(body.error||`HTTP ${r.status}`)}
    updateFindControls();
    const reader=r.body.getReader(),decoder=new TextDecoder();let buffer="";
    const consume=async(final=false)=>{
      let newline;
      while((newline=buffer.indexOf("\n"))>=0||final&&buffer.length){
        const line=newline>=0?buffer.slice(0,newline):buffer;
        buffer=newline>=0?buffer.slice(newline+1):"";
        if(!line.trim())continue;
        const event=JSON.parse(line);
        if(seq!==findSeq)return;
        if(event.type==="error")throw new Error(event.error||"find");
        if(event.words?.length)findStreamWords.push(...event.words);
        findResult.total=event.total||0;
        findResult.pages=Math.ceil(findResult.total/300);
        if(event.done){findStreamDone=true;findResult.total=event.total||0;findResult.pages=Math.ceil(findResult.total/300);finish()}
        updateBrowseProgress(t(findFilter?"browse.filteringWords":"browse.searchingWords")+" · "+num(event.total||findStreamWords.length));
        if(findFilter){
          if(findPendingPage&&findPendingPage<=Math.ceil(findStreamWords.length/300)){findFilterPage=findPendingPage;findPendingPage=0}
          render();
        }else if(findPendingAnchorMove&&event.done){
          const lower=browseFindLowerBound(findAnchorWord),upper=browseFindUpperBound(findAnchorWord);
          findIndex=findPendingAnchorMove>0?upper:lower-1;findPendingAnchorMove=0;
          if(findIndex>=0&&findIndex<findStreamWords.length){findAnchorWord="";updateFindControls();show({at:currentFoundWord()},"replace")}
          else{findIndex=-1;updateFindControls()}
        }else if(findIndex<0&&findStreamWords.length&&!findAnchorWord){
          findIndex=0;updateFindControls();show({at:findStreamWords[0]},record);
        }else if(findPendingMove&&findIndex+findPendingMove<findStreamWords.length){
          findIndex+=findPendingMove;findPendingMove=0;updateFindControls();show({at:currentFoundWord()},"replace");
        }else updateFindControls();
        if(event.done){
          if(findPendingMove){
            if(findStreamWords.length)findIndex=Math.max(0,Math.min(findStreamWords.length-1,findIndex+findPendingMove));
            findPendingMove=0;updateFindControls();if(!findFilter&&findIndex>=0)show({at:currentFoundWord()},"replace")
          }
          if(findPendingPage){findFilterPage=Math.max(1,Math.min(findPendingPage,Math.max(1,findResult.pages)));findPendingPage=0;render()}
        }
      }
    };
    while(true){
      const {value,done}=await reader.read();
      if(done){buffer+=decoder.decode();await consume(true);break}
      buffer+=decoder.decode(value,{stream:true});await consume();
    }
    finish();
    if(seq===findSeq){findStreamDone=true;updateFindControls();render()}
  }catch(e){
    if(seq!==findSeq)return;
    if(e.name==="AbortError"){
      findStreamDone=true;findPendingMove=0;findPendingPage=0;
      if(findResult){findResult.total=findStreamWords.length;findResult.pages=Math.ceil(findResult.total/300)}
      finish();updateFindControls();render();return;
    }
    finish();
    findStreamDone=true;
    findResult=null;findIndex=-1;
    $("findCount").textContent="!";$("findCount").title=window.wudictI18n.errorText(e.message);
    browseTrace("find failed",{dict:dictId,error:e.message});

function findChanged(){

  browseSeq++;

  findApplyPending=browseNeedsApply();findApproved=!findApplyPending;
  appliedFindMask=findMask;
  findAnchorWord="";findPendingAnchorMove=0;
  if(findApplyPending){
    findResult=null;findIndex=-1;findStreamDone=true;findStreamWords=[];findPendingMove=0;
    updateFindControls();render();return;
  }
  findResult=null;findIndex=-1;findStreamDone=true;findStreamWords=[];findPendingMove=0;
  if(!$("findInput").value.trim()){updateFindControls();render();return}
  $("findCount").textContent="…";
  findTimer=setTimeout(()=>fetchFound(1,0,"replace"),SEARCH_DEBOUNCE_MS);
}
function applyFind(){
  if(!browseNeedsApply())return;
  clearTimeout(findTimer);
  findApplyPending=false;findApproved=true;appliedFindMask=findMask;
  findResult=null;findIndex=-1;findStreamDone=true;findStreamWords=[];findPendingMove=0;findAnchorWord="";findPendingAnchorMove=0;
  if(!$('findInput').value.trim()){updateFindControls();render();return}
  $('findCount').textContent='…';

function findMove(delta){
  if(findFilter||!findResult)return;
  if(findResult.stream){
    if(findAnchorWord){
      if(!findStreamWords.length)return;
      if(!findStreamDone){findPendingAnchorMove=delta;updateFindControls();return}
      const lower=browseFindLowerBound(findAnchorWord),upper=browseFindUpperBound(findAnchorWord);
      findIndex=delta>0?upper:lower-1;
      if(findIndex<0||findIndex>=findStreamWords.length){findIndex=-1;findPendingAnchorMove=0;updateFindControls();return}
      findAnchorWord="";findPendingAnchorMove=0;updateFindControls();show({at:currentFoundWord()},"push");return;
    }
    if(findIndex<0)return;
    const requested=findIndex+(findPendingMove||0)+delta;
    if(requested<0){
      if(!findStreamWords.length)return;
      findIndex=(requested%findStreamWords.length+findStreamWords.length)%findStreamWords.length;
      findPendingMove=0;updateFindControls();show({at:currentFoundWord()},"push");return;
    }
    if(requested<findStreamWords.length){
      findPendingMove=0;findIndex=requested;updateFindControls();show({at:currentFoundWord()},"push");return;
    }
    if(!findStreamDone){findPendingMove=requested-findIndex;updateFindControls();return}
    if(!findStreamWords.length)return;
    findIndex=requested%findStreamWords.length;findPendingMove=0;updateFindControls();show({at:currentFoundWord()},"push");return;
  }
  if(!findResult.total)return;
  const target=(findIndex+delta+findResult.total)%findResult.total;
  const page=Math.floor(target/findResult.size)+1;
  if(page!==findResult.page)fetchFound(page,target,"push");
  else{findIndex=target;updateFindControls();show({at:currentFoundWord()},"push")}
}
function toggleFindFilter(){
  findFilter=!findFilter;

  updateFindControls();
  if(findAwaitingApply()){render();return}
  if(findFilter&&$("findInput").value.trim()&&!findResult){fetchFound(1,0,"replace");return}
  render();
}

function browseReturnURL(targetWord=""){
  const url=new URL(location.href);
  const query=$("findInput").value.trim();
  if(query){
    url.searchParams.set("find",query);
    if(findFilter)url.searchParams.set("filter","1");
    if(findMask)url.searchParams.set("wildcards","1");
    if(findResult){url.searchParams.set("fp",String(findFilter?findFilterPage:findResult.page));url.searchParams.set("fi",String(Math.max(0,findIndex)))}
  }
  url.searchParams.set("y",String(Math.round($("list").parentElement.scrollTop)));
  if(targetWord)url.searchParams.set("word",targetWord);
  return url.pathname+url.search;
}

function restoreBrowsePosition(targetWord,scrollTop){
  const restoreStarted=performance.now();
  requestAnimationFrame(()=>{
    const viewport=$("list").parentElement;
    const target=targetWord?[...$("list").querySelectorAll("a")].find(link=>link.textContent===targetWord):null;
    if(!target)viewport.scrollTop=scrollTop;
    else{
      const view=viewport.getBoundingClientRect(),item=target.getBoundingClientRect();
      viewport.scrollTop+=item.top-view.top-(viewport.clientHeight-item.height)/2;
    }
    logBrowseReturn("browse_return_ready");
    if(browseReturnStartedAt)logBrowseReturn("browse_return_restore_position",performance.now()-restoreStarted);
  });

function browsePageKey(dict,page){return dict+"|"+page}
function browsePageMetrics(page){
  const words=Array.isArray(page.words)?page.words:[];
  const jsonBytes=new TextEncoder().encode(JSON.stringify(page)).length;
  const chars=words.reduce((sum,word)=>sum+(typeof word==="string"?word.length:0),0);
  return {jsonBytes,heapBytes:chars*2+words.length*40+256,words:words.length};
}
function dictionaryCacheTrace(event,page){
  if(typeof window.wudictNativeCall==="function")return;
  let enabled=false;try{enabled=localStorage.getItem("wudict_dictionary_cache_diagnostics")==="1"}catch(_){}
  if(!enabled||!page)return;
  const entries=[...browsePageCache.entries()].filter(([,item])=>item.dict===page.dict);
  const cacheBytes=entries.reduce((sum,[key])=>sum+(browsePageCacheMetrics.get(key)?.heapBytes||0),0);
  const cacheJsonBytes=entries.reduce((sum,[key])=>sum+(browsePageCacheMetrics.get(key)?.jsonBytes||0),0);
  const pageMetrics=browsePageMetrics(page);
  const totalPages=Number.isSafeInteger(page.pages)?page.pages:0;
  const estimatedAllPagesBytes=entries.length?Math.round(cacheBytes/entries.length*totalPages):0;
  sendBrowseDiagnostic({event,dict:page.dict,page:page.page,words:pageMetrics.words,pageBytes:pageMetrics.heapBytes,
      pageJsonBytes:pageMetrics.jsonBytes,cachePages:entries.length,cacheBytes,cacheJsonBytes,totalPages,estimatedAllPagesBytes});
}
function rememberBrowsePage(page,event="page_cache_saved"){
  if(!page||!Number.isSafeInteger(page.page)||!Array.isArray(page.words))return;
  const {alphabet,...saved}=page,key=browsePageKey(page.dict,page.page);
  browsePageCache.delete(key);browsePageCache.set(key,saved);
  browsePageCacheMetrics.set(key,browsePageMetrics(saved));
  while(browsePageCache.size>BROWSE_PAGE_CACHE_LIMIT){
    const oldest=browsePageCache.keys().next().value;browsePageCache.delete(oldest);browsePageCacheMetrics.delete(oldest);
  }
  dictionaryCacheTrace(event,saved);
}
function restoreBrowsePage(dict,pageNumber){
  const key=browsePageKey(dict,pageNumber);
  let page=browsePageCache.get(key);
  if(page){browsePageCache.delete(key);browsePageCache.set(key,page)}
  else try{
    const saved=JSON.parse(sessionStorage.getItem(BROWSE_PAGE_SESSION_KEY)||"null");
    if(!saved||Date.now()-saved.savedAt>30*60*1000)return null;
    const pages=Array.isArray(saved.pages)?saved.pages:(saved.page?[saved.page]:[]);
    page=pages.find(item=>item.dict===dict&&item.page===pageNumber)||null;
    if(!page)return null;
  }catch(_){return null}
  if(!Number.isSafeInteger(page.total)||!Array.isArray(page.words)||page.words.some(word=>typeof word!=="string"))return null;
  const alphabet=browseAlphabetCache.get(dict);
  if(!alphabet||alphabet.total!==page.total)return null;
  rememberBrowsePage(page,"page_cache_restored");
  return {...page,alphabet:alphabet.letters};
}
function saveBrowsePage(){
  if(!state)return;
  rememberBrowsePage(state);
  const pages=[...browsePageCache.values()].filter(page=>page.dict===state.dict).slice(-BROWSE_PAGE_SESSION_LIMIT);
  try{sessionStorage.setItem(BROWSE_PAGE_SESSION_KEY,JSON.stringify({savedAt:Date.now(),pages}))}catch(_){}
}
function prefetchBrowsePage(dict,pageNumber,lastPage){
  if(pageNumber>lastPage||restoreBrowsePage(dict,pageNumber))return Promise.resolve(null);
  const key=browsePageKey(dict,pageNumber),running=browsePagePrefetches.get(key);
  if(running)return running;
  const controller=new AbortController();
  const params=new URLSearchParams({dict,p:String(pageNumber),strip:"0"});
  const request=browseFetch("/api/browse?"+params,{signal:controller.signal})
    .then(response=>response.ok?response.json():null)
    .then(page=>{
      const alphabet=browseAlphabetCache.get(dict);
      if(page&&page.dict===dict&&page.page===pageNumber&&alphabet&&page.total===alphabet.total){rememberBrowsePage(page);return {...page,alphabet:alphabet.letters}}
      return null;
    }).catch(()=>null).finally(()=>browsePagePrefetches.delete(key));
  browsePagePrefetches.set(key,request);
  return request;
}
function prefetchNextBrowsePage(page){

}

      '&from='+encodeURIComponent(d.dict)+'&mode=exact&browse='+returnTo+'" title="'+e+'">'+highlightedWord(title,ranges)+"</a>";
  }).join("")||(filtering?(findResult.stream&&!findStreamDone?"":'<p class="browse-empty">'+tx("browse.noMatches")+'</p>'):"");

     and its visible window is rendered at a time. */

  $("stripScrollbar").hidden=!stripItems.length;
  const strip=$("strip"),track=$("stripTrack"),stripStarted=performance.now();
  let stripBuilt=stripStarted,stripReady=stripStarted;
  {
    const stripKey=filtering?d.dict+":filter:"+findSeq:d.dict;
    if(stripFor!==stripKey){
      if(stripFor===d.dict)baseStripGeometry={dict:d.dict,metricKey:stripMetricKey,widths:stripWidths.slice(),offsets:stripOffsets.slice(),totalWidth:stripTotalWidth,painted:stripLettersPainted,scroll:strip.scrollLeft};

      stripMeasureStarted=0;
      stripFor=stripKey;stripLettersPainted=0;stripMetricKey="";stripWidths=[];stripOffsets=[];stripTotalWidth=0;
      stripCurrentIndex=-1;stripCurrentPositionedIndex=-1;stripWindowStart=stripWindowEnd=-1;strip.scrollLeft=0;
      if(!filtering&&baseStripGeometry?.dict===d.dict&&baseStripGeometry.widths.length===stripItems.length){
        stripMetricKey=baseStripGeometry.metricKey;stripWidths=baseStripGeometry.widths.slice();stripOffsets=baseStripGeometry.offsets.slice();stripTotalWidth=baseStripGeometry.totalWidth;stripLettersPainted=baseStripGeometry.painted;
        track.style.width=Math.max(strip.clientWidth,stripTotalWidth)+"px";strip.scrollLeft=baseStripGeometry.scroll;
      }
      track.replaceChildren($("stripMeasure"));
    }
    measureStripItems(stripItems);
    stripBuilt=performance.now();
  /* Highlight what was ASKED for, not what the page happens to start with.
     Both a chip click and a jump snap down to the page grid, so the page
     holding the first K opens in the tail of J - and a strip that answers a
     click on K by lighting up J reads as a bug, because it is one. A mark
     outside this page (a page turn, a reload, a clamped bookmark) falls back
     to where the page starts, which is then exactly where the reader is. */
    const at=filtering?(filterPage-1)*300:(d.page-1)*d.size;
    let mark=filtering?at:d.mark;
    if(!(mark>=at&&mark<at+d.size))mark=at;
    let lo=0,hi=stripItems.length;
    while(lo<hi){const mid=(lo+hi)>>>1;if(stripItems[mid].o<=mark)lo=mid+1;else hi=mid}
    const currentIndex=lo-1;
    const currentChanged=currentIndex!==stripCurrentIndex;
    if(currentChanged)stripCurrentIndex=currentIndex;
    if((filtering||browseAlphabetCache.has(d.dict))&&currentIndex>=0&&currentIndex<stripOffsets.length&&stripCurrentPositionedIndex!==currentIndex){
      revealStripIndex(currentIndex);
    }
    renderVirtualStrip(currentChanged);
    stripReady=performance.now();
  }
  requestAnimationFrame(updateStripArrows);

  const pages=filtering?(findResult.stream?Math.ceil(findStreamWords.length/300):findResult.pages):d.pages;
  const page=filtering?filterPage:d.page;
  document.querySelectorAll("[data-pos]").forEach(el=>{el.textContent=page+"/"+(pages||1)+(filtering&&findResult.stream&&!findStreamDone?"+":"");el.disabled=!!(filtering&&findResult.stream&&!findStreamDone)});
  const hasMore=filtering&&findResult.stream&&!findStreamDone;
  const ends={first:page<=1,prev:page<=1,next:hasMore?false:page>=pages,last:hasMore?false:page>=pages};
  document.querySelectorAll("[data-go]").forEach(b=>{b.disabled=!!ends[b.dataset.go]});
  browseTrace("render",{dict:d.dict,page:d.page,words:words.length,letters:d.alphabet.length,
    wordsMs:Math.round(wordsReady-renderStarted),stripBuildMs:Math.round(stripBuilt-stripStarted),
    stripMarkMs:Math.round(stripReady-stripBuilt),totalMs:Math.round(performance.now()-renderStarted)});
  if(browseNavContext&&!browseNavContext.firstPaint){
    browseNavContext.firstPaint=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      logBrowseNavigation("first_words_painted",performance.now()-renderStarted,{words:words.length});
      logBrowseNavigation("page_ready",performance.now(),{words:words.length});
      logBrowseReturn("browse_return_page_ready");
      if(browseReturnStartedAt&&!browseReturnNeedsRestore)logBrowseReturn("browse_return_ready");
    }));
  }
}

function turn(where){
  if(!state)return;
  const filtered=findFilter&&findResult&&$("findInput").value.trim();
  if(filtered&&findResult.stream){
    const pages=Math.ceil(findStreamWords.length/300),current=findFilterPage;
    const target=where==="prev"?current-1:where==="next"?current+1:where==="first"?1:findStreamDone?pages:pages+1;
    if(target<1)return;
    if(target<=pages){findFilterPage=target;render();scrollTo(0,0)}
    else if(!findStreamDone)findPendingPage=target;
    return;
  }
  const page=filtered?findResult.page:state.page,pages=filtered?findResult.pages:state.pages;
  const p=where==="prev"?page-1:where==="next"?page+1:where==="first"?1:pages;
  if(p>=1&&p<=pages&&p!==page){
    if(filtered)fetchFound(p,0,"replace");else show({p},"push");
  }
}

function browseGotoOpen(){
  if(!state||browsePageBusy)return;
  const filtering=findFilter&&!!$("findInput").value.trim()&&findResult;
  if(filtering&&findResult.stream&&!findStreamDone)return;
  const pages=filtering?(findResult.stream?Math.ceil(findStreamWords.length/300):findResult.pages):state.pages;
  const page=filtering?findFilterPage:state.page;
  const total=Math.max(1,pages||1);
  const input=$("browseGotoInput");
  browseGotoTarget="block";
  $("browseGotoHeading").textContent=t("browse.gotoBlock");
  $("browseGotoLabel").textContent=t("browse.gotoBlockLabel");
  input.min="1";input.max=String(total);input.value=String(Math.min(total,Math.max(1,page||1)));
  $("browseGotoRange").textContent=t("browse.gotoBlockRange",{total:num(total)});
  $("browseGotoDialog").showModal();input.focus();input.select();
}
function browseFindGotoOpen(){
  if(findFilter||!$("findInput").value.trim()||!findResult||!findStreamDone||!findStreamWords.length)return;
  const total=findStreamWords.length;browseGotoTarget="match";
  const input=$("browseGotoInput");$("browseGotoHeading").textContent=t("browse.gotoMatch");
  $("browseGotoLabel").textContent=t("browse.gotoMatchLabel");input.min="1";input.max=String(total);
  input.value=String(Math.max(1,Math.min(total,findAnchorWord?browseFindLowerBound(findAnchorWord)+1:findIndex+1)));
  $("browseGotoRange").textContent=t("browse.gotoMatchRange",{total:num(total)});
  $("browseGotoDialog").showModal();input.focus();input.select();
}
function browseGotoApply(event){
  event?.preventDefault();
  if(!state||browsePageBusy)return;
  if(browseGotoTarget==="match"){
    const target=Number($("browseGotoInput").value),total=findStreamWords.length;
    if(!Number.isInteger(target)||target<1||target>total){$("browseGotoInput").reportValidity();return}
    $("browseGotoDialog").close();findAnchorWord="";findPendingAnchorMove=0;findIndex=target-1;
    updateFindControls();show({at:currentFoundWord()},"push");return;
  }
  const filtering=findFilter&&!!$("findInput").value.trim()&&findResult;
  if(filtering&&findResult.stream&&!findStreamDone)return;
  const pages=filtering?(findResult.stream?Math.ceil(findStreamWords.length/300):findResult.pages):state.pages;
  const target=Number($("browseGotoInput").value);
  const total=Math.max(1,pages||1);
  if(!Number.isInteger(target)||target<1||target>total){$("browseGotoInput").reportValidity();return}
  $("browseGotoDialog").close();
  if(target===(filtering?findFilterPage:state.page))return;
  if(filtering&&findResult.stream){findFilterPage=target;render();scrollTo(0,0)}
  else if(filtering)fetchFound(target,0,"replace");
  else show({p:target},"push");
}
$("browseGotoForm").addEventListener("submit",browseGotoApply);
$("browseGotoCancel").addEventListener("click",()=>$("browseGotoDialog").close());
$("browseGotoClose").addEventListener("click",()=>$("browseGotoDialog").close());
document.querySelectorAll("[data-pos]").forEach(el=>el.addEventListener("click",browseGotoOpen));
document.querySelectorAll("[data-pos]").forEach(el=>el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();browseGotoOpen()}}));

function browseWordContextEligible(){
  return !!(findResult&&$("findInput").value.trim()&&!findFilter&&!findAwaitingApply());
}
function browseHideWordContextMenu(){
  $("browseWordContextMenu").hidden=true;browseWordContextTarget=null;
}
function browseShowWordContextMenu(word,x,y){
  if(!browseWordContextEligible())return false;
  const menu=$("browseWordContextMenu");browseWordContextTarget=word;menu.hidden=false;
  const rect=menu.getBoundingClientRect(),margin=8;
  menu.style.left=Math.max(margin,Math.min(x,innerWidth-rect.width-margin))+"px";
  menu.style.top=Math.max(margin,Math.min(y,innerHeight-rect.height-margin))+"px";
  menu.querySelector("button").focus({preventScroll:true});
  return true;
}
function browseContextWordFromEvent(event){
  const link=event.target.closest(".words a");
  return link&&$("list").contains(link)?link:null;
}
document.addEventListener("contextmenu",event=>{
  const link=browseContextWordFromEvent(event);if(!link)return;
  if(browseShowWordContextMenu(link.textContent.trim(),event.clientX,event.clientY))event.preventDefault();
});
$("list").addEventListener("pointerdown",event=>{
  if(event.pointerType!=="touch"&&event.pointerType!=="pen")return;
  const link=browseContextWordFromEvent(event);if(!link||!browseWordContextEligible())return;
  clearTimeout(browseWordLongPressTimer);
  browseWordLongPressPoint={x:event.clientX,y:event.clientY,word:link.textContent.trim()};
  browseWordLongPressTimer=setTimeout(()=>{
    if(browseShowWordContextMenu(browseWordLongPressPoint.word,browseWordLongPressPoint.x,browseWordLongPressPoint.y)){
      browseWordSuppressWord=browseWordLongPressPoint.word;
      setTimeout(()=>browseWordSuppressWord="",1200);
    }
    browseWordLongPressPoint=null;
  },550);
});
$("list").addEventListener("pointermove",event=>{
  if(!browseWordLongPressPoint)return;
  if(Math.hypot(event.clientX-browseWordLongPressPoint.x,event.clientY-browseWordLongPressPoint.y)>12){
    clearTimeout(browseWordLongPressTimer);browseWordLongPressPoint=null;
  }
});
for(const type of ["pointerup","pointercancel","pointerleave"])$("list").addEventListener(type,()=>{
  clearTimeout(browseWordLongPressTimer);browseWordLongPressPoint=null;
});
$("browseWordFindFrom").addEventListener("click",()=>{
  const word=browseWordContextTarget;browseHideWordContextMenu();if(!word)return;
  findAnchorWord=word;findPendingAnchorMove=0;updateFindControls();render();
});
document.addEventListener("click",event=>{
  const wordLink=event.target.closest(".words a");
  if(browseWordSuppressWord&&wordLink&&wordLink.textContent.trim()===browseWordSuppressWord){
    event.preventDefault();event.stopPropagation();browseWordSuppressWord="";return;
  }
  if(!$("browseWordContextMenu").hidden&&!event.target.closest("#browseWordContextMenu"))browseHideWordContextMenu();
},true);
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!$("browseWordContextMenu").hidden)browseHideWordContextMenu()});
addEventListener("scroll",browseHideWordContextMenu,true);
addEventListener("resize",browseHideWordContextMenu);

/* Browsing needs the headword index. Create it from Dictionary Settings. */
async function unprepared(){
  card("<b>"+tx("browse.indexRequired")+"</b><p><a href=\"/\">"+
    tx("browse.openApp")+"</a></p><p><a href=\"/browse\">"+
    tx("browse.chooseAnother")+"</a></p>");
}

/* No ?dict= is not an error: it is the question "which one?", and a page that
   can be reached from a bookmark bar has to be able to answer it. */
async function chooser(){
  const chooserStarted=performance.now();
  browseTrace("chooser start");
  logBrowseNavigation("chooser_request");
  const heading='<div class="chooser-head"><b>'+tx("browse.choose")+'</b><button type="button" id="closeBrowseChooser" aria-label="'+tx("pages.close")+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p class="chooser-hint">'+tx("browse.chooseHint")+'</p>';
  card(heading);
  let text="",ds=[];
  const endProgress=browseProgress(t("browse.loadingDictionaries"));
  let prefs;
  try{
    if(window.wudictAndroidGo){
      [prefs,ds]=await Promise.all([
        Promise.resolve().then(()=>JSON.parse(window.wudictAndroidGo.prefs())),
        androidChooserDicts()
      ]);
      browseTrace("chooser response",{status:200,fetchMs:Math.round(performance.now()-chooserStarted)});
      logBrowseNavigation("chooser_response",performance.now()-chooserStarted,{status:200,words:ds.length});
    }else if(typeof window.wudictNativeCall==="function"){
      const rows=[];
      [prefs]=await Promise.all([
        window.wudictNativeCall("prefs",""),
        window.wudictNativeCall("dicts","",message=>{if(message.t==="dict"&&message.dict&&!message.dict.error)rows.push(message.dict)})
      ]);
      ds=rows;
      browseTrace("chooser response",{status:200,fetchMs:Math.round(performance.now()-chooserStarted)});
      logBrowseNavigation("chooser_response",performance.now()-chooserStarted,{status:200,words:ds.length});
    }else{
      const [response,prefsResponse]=await Promise.all([fetch("/api/dicts"),fetch("/api/prefs")]);
      browseTrace("chooser response",{status:response.status,fetchMs:Math.round(performance.now()-chooserStarted)});
      logBrowseNavigation("chooser_response",performance.now()-chooserStarted,{status:response.status});
      if(!response.ok||!prefsResponse.ok)throw new Error("load");
      [text,prefs]=await Promise.all([response.text(),prefsResponse.json()]);
    }
  }catch(e){browseTrace("chooser failed",{totalMs:Math.round(performance.now()-chooserStarted)});logBrowseNavigation("load_failed",performance.now()-chooserStarted);endProgress();clearBrowseProgress();window.wudictTasks?.finishMatching?.("browse",t("browse.loadingDictionaries"));return card(heading+"<b>"+tx("browse.noAnswer")+"</b><p>"+tx("browse.loadFailed")+"</p>")}
  endProgress();
  if(!window.wudictAndroidGo&&typeof window.wudictNativeCall!=="function"){
    for(const line of text.split("\n")){
      if(!line)continue;
      let m;try{m=JSON.parse(line)}catch(e){continue}
      if(m.t==="dict"&&m.dict&&!m.dict.error){ds.push(m.dict)}
    }
  }
  // Match the All Dictionaries group: its saved order, pinned head, and
  // alphabetical tail all come from /api/prefs.
  const byId=new Map(ds.map(d=>[d.id,d]));
  const saved=(prefs.dicts||[]).map(d=>d.id).filter(id=>byId.has(id));
  const pinned=new Set((prefs.dicts||[]).filter(d=>d.pinned).map(d=>d.id));
  const customTitles=new Map((prefs.dicts||[]).filter(d=>d.title).map(d=>[d.id,d.title]));
  const label=d=>customTitles.get(d.id)||d.name||d.path?.split(/[\\/]/).pop()||d.id;
  const collator=new Intl.Collator(window.wudictI18n.language,{sensitivity:"base",numeric:true});
  const alpha=ids=>{
    const fixed=ids.filter(id=>pinned.has(id)),tail=ids.filter(id=>!pinned.has(id));
    tail.sort((a,b)=>collator.compare(label(byId.get(a)),label(byId.get(b)))||a.localeCompare(b));
    return fixed.concat(tail);
  };
  let customOrder=prefs.ui?.customOrder;
  if(typeof customOrder!=="boolean"){
    const initial=alpha(saved);
    customOrder=!initial.every((id,i)=>id===saved[i]);
  }
  const ordered=[...saved,...ds.map(d=>d.id).filter(id=>!saved.includes(id))];
  const ids=customOrder?ordered.slice(0,saved.length).concat(alpha(ordered.slice(saved.length))):alpha(ordered);
  ds.splice(0,ds.length,...ids.map(id=>byId.get(id)).filter(Boolean));
  browseTrace("chooser ready",{words:ds.length,totalMs:Math.round(performance.now()-chooserStarted)});
  // The chooser is ready, so no dictionary-loading task should remain in the
  // shared progress notice, including one left by an earlier visit.
  clearBrowseProgress();
  window.wudictTasks?.finishMatching?.("browse",t("browse.loadingDictionaries"));
  if(!ds.length)return card(heading+"<b>"+tx("browse.empty")+"</b><p>"+tx("browse.emptyBody")+
    '</p><p><a href="/">'+tx("browse.openApp")+"</a></p>");
  card(heading+"<div class='picks'>"+
    ds.map(d=>'<a href="?dict='+encodeURIComponent(d.id)+'&chooser=1"><span class="pick-name">'+esc(label(d))+'</span>'+
      (d.entries?'<span class="pick-count">'+tx("browse.entries",{count:d.entries,number:num(d.entries)})+"</span>":"")+"</a>").join("")+"</div>"+
    '<div class="list-search-dock" role="search"></div>',true);
  requestAnimationFrame(()=>requestAnimationFrame(()=>logBrowseNavigation("chooser_ready",performance.now()-chooserStarted,{words:ds.length})));
  const picks=$("msg").querySelector(".picks");
  chooserSearch=window.wudictListSearch.create({
    root:picks,itemSelector:"a",dock:$("msg").querySelector(".list-search-dock"),
    scrollContainer:picks,getText:item=>item.querySelector(".pick-name")?.textContent||"",
    highlightSelector:".pick-name",initiallyFiltering:true,labels:{
      placeholder:t("dictUI.listSearchPlaceholder"),filterPlaceholder:t("dictUI.listFilterPlaceholder"),
      search:t("dictUI.listSearchLabel"),
      previous:t("dictUI.listSearchPrevious"),next:t("dictUI.listSearchNext"),
      filter:t("dictUI.listSearchFilter"),
      count:t("dictUI.listSearchCount",{current:"{current}",total:"{total}"})
    }
  });
}

function keepWebView2Mode(target){
  const current=new URL(location.href),next=new URL(target,current);
  if(current.searchParams.get("wudict_webview2")==="1")next.searchParams.set("wudict_webview2","1");
  return next.pathname+next.search+next.hash;
}
document.addEventListener("click",e=>{
  if(e.target.closest("#browseWordFindFrom"))return;
  const link=e.target.closest("a[href]");
  if(link)link.href=keepWebView2Mode(link.href);
  if(link&&e.button===0&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&!e.altKey&&browseArticleDiagnosticsEnabled()){
    const target=new URL(link.href,location.href);
    if(target.origin===location.origin&&target.pathname==="/browse"&&target.searchParams.has("dict")&&!target.searchParams.has("browseDiagStart")){
      target.searchParams.set("browseDiagStart",String(Date.now()));
      link.href=target.pathname+target.search+target.hash;
    }
  }
  const wordLink=e.target.closest(".words a");
  if(wordLink){
    saveBrowsePage();
    saveBrowseFind();
    const url=new URL(wordLink.href);
    let returnTo=browseReturnURL(url.searchParams.get("q")||"");
    if(browseArticleDiagnosticsEnabled()){
      const startedAt=String(Date.now()),returnURLObj=new URL(returnTo,location.href);
      url.searchParams.set("browseDiagStart",startedAt);
      url.searchParams.set("browsePage",String(state?.page||0));
      returnURLObj.searchParams.set("browseDiagStart",startedAt);
      returnURLObj.searchParams.set("browsePage",String(state?.page||0));
      returnTo=returnURLObj.pathname+returnURLObj.search;
    }
    url.searchParams.set("browse",returnTo);
    // Make the prior history entry carry the target as well. If returning from
    // the article can use WebView/browser history, Browse restores this exact
    // word and scroll position without constructing another return URL.
    history.replaceState(history.state,"",returnTo);
    wordLink.href=url.pathname+url.search;
    return;
  }
  if(e.target.closest("#closeBrowse")){
    location.href=keepWebView2Mode(new URLSearchParams(location.search).get("chooser")==="1"?"/browse":"/");
    return;
  }
  if(e.target.closest("#closeBrowseChooser")){
    location.href=keepWebView2Mode("/");
    return;
  }
  const g=e.target.closest("[data-go]");
  if(g)return turn(g.dataset.go);
  const c=e.target.closest(".strip button[data-o]");
  if(c&&state)selectStripOffset(Number(c.dataset.o),Number(c.dataset.stripIndex));
});

$("findInput").addEventListener("keydown",e=>{
  if(e.key==="Tab"&&!e.shiftKey){e.preventDefault();toggleFindFilter()}
  else if(e.key==="ArrowUp"){e.preventDefault();findMove(-1)}
  else if(e.key==="ArrowDown"||e.key==="Enter"){
    if(e.key==="Enter"&&findAwaitingApply()){e.preventDefault();applyFind();return}
    e.preventDefault();findMove(e.shiftKey?-1:1)
  }
});
updateFindControls();

addEventListener("keydown",e=>{
  if(browsePageBusy&&e.target!==$("findInput")){e.preventDefault();return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target.tagName==="INPUT"){
    if(e.key==="Escape"){
      e.target.value="";
      if(e.target===$("findInput"))findChanged();
      e.target.blur();
    }
    return;
  }
  switch(e.key){
    case"ArrowLeft":case"PageUp":e.preventDefault();return turn("prev");
    case"ArrowRight":case"PageDown":e.preventDefault();return turn("next");
    case"Home":e.preventDefault();return turn("first");
    case"End":e.preventDefault();return turn("last");
  }
  if(e.key.length===1&&e.key.trim()&&state)$("findInput").focus();
});

addEventListener("popstate",()=>{
  const p=new URLSearchParams(location.search);
  if(!p.get("dict"))return chooser();
  dictId=p.get("dict");
  show({p:Number(p.get("p"))||1},"none");
});

(function(){
  const p=new URLSearchParams(location.search);
  dictId=p.get("dict")||"";
  if(!dictId)return chooser();
  show({p:Number(p.get("p"))||1},"replace").then(async()=>{
    if(!state)return;
    const query=p.get("find")||"";
    if(query){
      $("findInput").value=query;findFilter=p.get("filter")==="1";findMask=p.get("wildcards")==="1"||p.get("mask")==="1";
      updateFindControls();
      appliedFindMask=findMask;
      findApproved=true;findApplyPending=false;
      const page=Math.max(1,Number(p.get("fp"))||1),index=Math.max(0,Number(p.get("fi"))||0);
      if(!restoreBrowseFind(query,page,index))await fetchFound(page,index,"none");
    }
    if(p.has("y")||p.has("word"))restoreBrowsePosition(p.get("word")||"",Math.max(0,Number(p.get("y"))||0));
  });
})();
addEventListener("pageshow",event=>{
  if(!event.persisted||!browseArticleDiagnosticsEnabled())return;
  flushArticleReturnDiagnostic();
  logBrowseReturn("browse_return_bfcache");
  requestAnimationFrame(()=>requestAnimationFrame(()=>logBrowseReturn("browse_return_ready")));
});
