<html lang="{{T:locale}}">
<head>
<meta charset="utf-8">
{{I18N}}
<script>
// An optional host background, the same hook setup.html carries: the Android
// host paints the chosen image (or colour) behind a transparent WebView, and
// this is what tells the page it is there, before the first paint.
// Session storage preserves it across page reloads; an explicit empty URL
// value withdraws it on the next launch.
window.wudictShellBackground = function (color, image, imageName, paper) {
  var root = document.documentElement;
  root.toggleAttribute('data-shell-image', !!image);
  // The paper an enabled PRESET paints, handed here by the app page: that page
  // paints this paper with its own layer and does not wear it as a shell
  // colour, while this document - no layers of its own - has nothing but the
  // host to give it a ground. It arrives with every call, and it is also kept
  // in wudict_shell_paper, because this page is reached by tapping a link and
  // so carries no shell parameters of its own. The READER's own colour wins
  // when there is one: that is the colour the app page paints as well.
  if (!/^#[0-9a-f]{6}$/i.test(color) && /^#[0-9a-f]{6}$/i.test(paper || '')) color = paper;
  var valid = /^#[0-9a-f]{6}$/i.test(color);
  root.toggleAttribute('data-shell-custom', valid || !!image);
  if (valid) {
    var rgb = color.slice(1).match(/../g).map(function (v) { return parseInt(v, 16); });
    root.setAttribute('data-shell-tone', rgb[0] * .299 + rgb[1] * .587 + rgb[2] * .114 > 160 ? 'light' : 'dark');
  } else root.removeAttribute('data-shell-tone');
  if (valid) root.style.setProperty('--bg', color, 'important');
  else root.style.removeProperty('--bg');
  try {
    if (image) sessionStorage.setItem('wudict_shell_image', '1');
    else sessionStorage.removeItem('wudict_shell_image');
    if (valid) sessionStorage.setItem('wudict_shell_bg', color);
    else sessionStorage.removeItem('wudict_shell_bg');
    if (/^#[0-9a-f]{6}$/i.test(paper || '')) sessionStorage.setItem('wudict_shell_paper', paper);
    else sessionStorage.removeItem('wudict_shell_paper');
  } catch (_) {}
};
(function () {
  var params = new URLSearchParams(location.search);
  var color = params.get('shell_bg');
  var image = params.get('shell_image');
  var paper = params.get('shell_paper');
  if (params.has('shell_bg') || params.has('shell_paper') || params.has('shell_image')) {
    params.delete('shell_bg');
    params.delete('shell_paper');
    params.delete('shell_image');
    var query = params.toString();
    history.replaceState(history.state, '', location.pathname + (query ? '?' + query : '') + location.hash);
  }
  if (color === null) {
    try { color = sessionStorage.getItem('wudict_shell_bg'); } catch (_) {}
  }
  if (image === null) {
    try { image = sessionStorage.getItem('wudict_shell_image'); } catch (_) {}
  }
  if (paper === null) {
    try { paper = sessionStorage.getItem('wudict_shell_paper'); } catch (_) {}
  }
  window.wudictShellBackground(color || '', image === '1', undefined, paper || '');
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{T:pages.lemmas}}</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/setup.css?v={{CSS}}">
<!-- The app halves of any preset that asked to be on this page too (manifest
     "pages" — Quiet labels is the one): attached by the server, after
     setup.css so their token overrides win the tie, and empty otherwise. -->
{{PRESETS}}
<script>
/* Apply the reader's saved Fonts settings before this standalone page paints. */
(function () {
  const defaults={base:1,title:1.15,section:1,addition:.9,hint:.8,
    controlHeight:1.6,controlFont:.9,mainControlHeight:1.05,mainControlFont:1.05};
  const names={base:'--ui-font-base',title:'--ui-font-title',section:'--ui-font-section',
    addition:'--ui-font-addition',hint:'--ui-hint-font-size',
    controlHeight:'--ui-control-height',controlFont:'--ui-control-font',
    mainControlHeight:'--ui-main-control-height',mainControlFont:'--ui-main-control-font'};
  let saved={};
  try { saved=JSON.parse(localStorage.getItem('wudict_settings_fonts')||'null')||{}; } catch (_) {}
  for(const [key,fallback] of Object.entries(defaults)){
    const value=Number(saved[key]),scale=Number.isFinite(value)?Math.min(key==='controlHeight'?4:2,Math.max(.5,value)):fallback;
    document.documentElement.style.setProperty(names[key],
      ['base','title','section','addition','hint'].includes(key)?scale+'rem':String(scale));
  }
})();
</script>
<style>
/* The host background, spelled exactly as setup.html spells it: the WebView is
   transparent over the wallpaper, the card floats on it, and the palette
   follows the tone of the colour the host sent. Copied rather than shared —
   the two pages are separate documents and neither loads the other's script. */
html[data-shell-image], html[data-shell-image] body { background:transparent !important; }
html[data-shell-custom] .card { background:rgba(255,255,255,.14); }
html[data-shell-custom] input,
html[data-shell-custom] code { background:rgba(255,255,255,.18); }
html[data-shell-tone="light"] {
  color-scheme:light; --fg:#2b2a28; --soft:#625b4d; --faint:#766e60;
  --line:rgba(89,75,56,.4); --accent:#865000; --ok:#38603c; --err:#a3322c;
}
html[data-shell-tone="dark"] {
  color-scheme:dark; --fg:#f4f1eb; --soft:#ded8cc; --faint:#c6beaf;
  --line:rgba(230,220,201,.4); --accent:#ffc773; --ok:#aad3ad; --err:#ffb3ad;
}
/* Page-specific only; palette, card, buttons and typography are shared. */
.card{max-width:640px;min-width:0;overflow-wrap:anywhere}
#list{margin:.618em 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;
  padding:.5em .618em;border-bottom:1px solid var(--line);font-size:13.5px}
.lrow:last-child{border-bottom:none}
/* Shape and width come from setup.css (appearance:none, 20px, the app's own
   square); this only holds the row's spacing. `width:auto` used to be how a
   platform checkbox kept its size against input{width:100%}. */
.lrow input[type=checkbox]{margin:0;flex:none}
.lrow .nm{flex:1 1 8em;min-width:0}
.lrow .cost{flex:none;color:var(--label);font-size:12px;font-variant-numeric:tabular-nums}
/* The indicator is the row's second line on a phone and its right edge on a
   desktop: order:1 with a full basis wraps it below everything else, and the
   media query is what decides whether that basis applies. */
.lrow .st{flex:0 1 auto;min-width:min(9em,100%);max-width:100%;text-align:right;font-size:12px;color:var(--label)}
.lrow .st.ok{color:var(--ok)}
.lrow .st.err{color:var(--err)}
.lrow .st.busy{color:var(--accent)}
.lrow.off{opacity:.55}
@media (max-width:520px){
  .lrow .st{order:1;flex:1 1 auto;min-width:0;text-align:left}
  .lrow .cost{order:1}
}
.note{font-size:12.5px;color:var(--label-quiet);margin:.2em 0 0}
.banner{font-size:13px;border:1px solid var(--line);border-radius:8px;
  padding:.5em .7em;margin:.618em 0 0;color:var(--label)}
.banner.warn{border-color:var(--err);color:var(--err)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:.5em;flex-wrap:wrap}
.formats a{color:var(--accent);text-decoration:none}
.formats a:hover{text-decoration:underline}
/* Lemmatization uses the same saved type and control scale as Settings. */
body{font-size:var(--ui-font-base)}
.top h1{font-size:var(--ui-font-title)}
.top button.x{box-sizing:border-box;display:grid;place-items:center;flex:none;
  width:calc(var(--ui-main-control-height) * 1em);height:calc(var(--ui-main-control-height) * 1em);
  min-height:calc(var(--ui-main-control-height) * 1em);padding:0;
  font-size:calc(var(--ui-main-control-font) * 1rem);line-height:1}
.card>p:first-of-type,.banner,.note,.lrow :is(.cost,.st),
.card>p.formats{font-size:var(--ui-hint-font-size)}
.head h2{font-size:var(--ui-font-section)}
.head #summary{font-size:var(--ui-font-addition)}
.lrow{min-height:calc(var(--ui-control-height) * 1em);
  font-size:calc(var(--ui-control-font) * 1rem)}
.lrow input[type=checkbox]{width:calc(var(--ui-control-height) * 1em);
  height:calc(var(--ui-control-height) * 1em)}
.lrow input[type=checkbox]:checked::after{left:35%;top:20%;width:25%;height:50%}
.lrow .nm{font-size:inherit}
</style>
</head>
<body>
<div class="card">
<!-- The page's closer (@see setup.css), same control as the configuration
     page's: back rather than a link to "/", so the page behind comes back as
     it was and the back gesture does not walk into this page again. Hidden on
     a first run, where "/" is served as /setup and there is nothing behind. -->
<div class="top">
<h1>{{T:pages.lemmas}}</h1>
<button type="button" class="x" id="closePage" aria-label="{{T:pages.close}}">✕</button>
</div>
<p>{{T:pages.lemmaIntro}}</p>

<div id="banner" class="banner hidden"></div>

<div class="head"><h2>{{T:pages.languages}}</h2><span class="note" id="summary"></span></div>
<div id="list"></div>
<p class="note" id="dir"></p>
<div id="shadow" class="banner warn hidden"></div>

<hr class="sep">
<p class="formats" id="credit"></p>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const tx=window.wudictI18n.t;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// decimal, the rule of index.html's mb and the server's logx.Size
const mb=n=>n<1e3?n+" B":n<1e6?Math.round(n/1e3)+" kB":n<1e7?(n/1e6).toFixed(1)+" MB":n<1e9?Math.round(n/1e6)+" MB":(n/1e9).toFixed(1)+" GB";

/* State lives on the SERVER, not here: a download is a job the server runs, so
   this page can be reloaded, rotated or closed and reopened without losing it.
   Everything drawn below comes from one GET, which is also what is polled. */
let polling=false;
const languageNames=typeof Intl.DisplayNames==="function"?new Intl.DisplayNames([window.wudictI18n.language],{type:"language"}):null;
function languageName(l){
  if(!languageNames)return l.name;
  try{const name=languageNames.of(l.code);return name&&name!==l.code?name:l.name}catch(_){return l.name}
}

async function load(){
  let j;
  try{ j=await (await fetch("/api/lemmas")).json() }
  catch(e){ $("banner").className="banner warn";$("banner").textContent=tx("pages.cannotReach");return null }
  render(j);
  return j;
}

function render(j){
  const list=$("list");
  list.textContent="";
  let installed=0;
  for(const l of j.languages){
    if(l.installed)installed++;
    list.appendChild(rowFor(l,j));
  }
  $("summary").textContent=j.languages.length?tx("pages.installedTotal",{number:installed,total:j.languages.length}):tx("pages.installedCount",{number:installed});
  $("dir").textContent=tx("pages.installedIn",{path:j.dir});

  const b=$("banner");
  if(!j.enabled){
    b.className="banner warn";
    b.textContent=tx("pages.lemmaOff");
  }else if(j.error){
    b.className="banner warn";
    b.textContent=tx("pages.catalogueFailed",{error:window.wudictI18n.errorText(j.error)});
  }else{
    b.className="banner hidden";
  }

  $("shadow").className=j.shadowed&&j.shadowed.length?"banner warn":"banner warn hidden";
  if(j.shadowed&&j.shadowed.length)$("shadow").textContent=j.shadowed.join("; ");

  /* ODbL: this data may be redistributed only with attribution, and the page
     that installs it is where a user will look for that. */
  const lic=j.languages.find(l=>l.license);
  $("credit").innerHTML=lic
    ? esc(tx("pages.wordLists",{source:lic.source||"",license:lic.license}))+
      (j.attribution?' · <a href="'+esc(j.attribution)+'" target="_blank" rel="noopener">'+esc(tx("pages.attribution"))+'</a>':"")
    : "";
}

function rowFor(l,j){
  const row=document.createElement("div");
  row.className="lrow"+(l.installed?"":" off");
  const cb=document.createElement("input");
  cb.type="checkbox";cb.checked=l.installed;cb.id="cb-"+l.code;
  cb.setAttribute("aria-label",languageName(l));
  const busy=l.state==="downloading";
  // Built-in English cannot be "not installed", so its box has nothing to say.
  cb.disabled=busy||(l.builtin&&!l.localSize)||(!l.installed&&!l.catalogued);
  cb.addEventListener("change",()=>toggle(l,cb));

  const nm=document.createElement("label");
  nm.className="nm";nm.htmlFor=cb.id;
  nm.textContent=languageName(l)+" ("+l.code+")";

  const cost=document.createElement("span");
  cost.className="cost";
  const bits=[];
  if(l.size)bits.push(mb(l.size));
  else if(l.localSize)bits.push(mb(l.localSize));
  if(l.heapMB)bits.push(tx("pages.memory",{number:l.heapMB}));
  cost.textContent=bits.join(" · ");

  const st=document.createElement("span");
  st.className="st";
  if(busy){
    st.className="st busy";
    // Guarded rather than trusting the numbers: a catalogue with no declared
    // size, or a row read from an older build, must read "Downloading…" and
    // never "Downloading… NaN%".
    var pct=l.total>0?Math.floor(100*(l.done||0)/l.total):-1;
    st.textContent=pct>=0?tx("pages.downloadPercent",{percent:Math.min(pct,100)}):tx("pages.downloading");
  }else if(l.state==="error"){
    st.className="st err";st.textContent="✕ "+window.wudictI18n.errorText(l.error);
  }else if(l.builtin&&!l.localSize){
    st.className="st ok";st.textContent=tx("pages.builtin");
  }else if(l.installed&&l.mismatch){
    st.className="st";st.textContent=tx("pages.installedDiffers");
  }else if(l.installed&&!l.catalogued){
    st.className="st ok";st.textContent=tx("pages.installedLocal");
  }else if(l.installed){
    st.className="st ok";st.textContent=tx("pages.installed");
  }
  row.append(cb,nm,cost,st);
  return row;
}

/* Checking installs, unchecking removes. The box is disabled the moment it is
   clicked and re-enabled by the next poll that reports a terminal state, so a
   second click cannot start a second download - the server refuses one anyway,
   but the UI should not invite it. */
async function toggle(l,cb){
  cb.disabled=true;
  if(cb.checked){
    setStatus(cb,"busy",tx("pages.downloading"));
    try{
      const r=await fetch("/api/lemmas?code="+encodeURIComponent(l.code),{method:"POST"});
      if(!r.ok){ const j=await r.json().catch(()=>({}));fail(cb,window.wudictI18n.errorText(j.error)||("HTTP "+r.status));return }
    }catch(e){ fail(cb,tx("pages.cannotReachShort"));return }
    poll();
    return;
  }
  const size=l.localSize?" ("+mb(l.localSize)+")":"";
  if(!confirm(tx("pages.removeLemmas",{language:languageName(l),size}))){
    cb.checked=true;cb.disabled=false;return;
  }
  setStatus(cb,"busy",tx("pages.removing"));
  try{
    const r=await fetch("/api/lemmas?code="+encodeURIComponent(l.code),{method:"DELETE"});
    if(!r.ok){ const j=await r.json().catch(()=>({}));fail(cb,window.wudictI18n.errorText(j.error)||("HTTP "+r.status));return }
  }catch(e){ fail(cb,tx("pages.cannotReachShort"));return }
  load();
}

function setStatus(cb,cls,text){
  const st=cb.parentElement.querySelector(".st");
  st.className="st "+cls;st.textContent=text;
}
function fail(cb,msg){
  cb.checked=!cb.checked;cb.disabled=false;setStatus(cb,"err","✕ "+msg);
}

/* Polling, not a stream. A browser allows about six connections per origin and
   a download here can be one of several; a stream each would leave the app
   unable to search while they ran. It also means progress is server state:
   nothing is lost when the page goes away, which on Android it does on every
   rotation. */
async function poll(){
  if(polling)return;
  polling=true;
  for(;;){
    const j=await load();
    if(!j||!j.languages.some(l=>l.state==="downloading"))break;
    await new Promise(r=>setTimeout(r,800));
  }
  polling=false;
}

load().then(j=>{ if(j&&j.languages.some(l=>l.state==="downloading"))poll() });

/* The ✕ closes the page the way the back gesture does — no navigation to "/",
   which would load the app from scratch and stack an entry the back gesture
   would then walk back into this page. A first run (where "/" is served as
   /setup) has nothing behind it, and shows no ✕. */
if(history.length>1)$("closePage").onclick=()=>history.back();
else $("closePage").hidden=true;
</script>
</body>
</html>
