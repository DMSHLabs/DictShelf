<html lang="{{T:locale}}">
<head>
<meta charset="utf-8">
{{I18N}}
<script>
// An optional host background, the same hook setup.html carries: the Android
// host paints the chosen image (or colour) behind a transparent WebView, and
// this is what tells the page it is there, before the first paint.
// Session storage preserves it across page reloads; an explicit empty URL
// value withdraws it on the next launch.
window.wudictShellBackground = function (color, image, imageName, paper) {
  var root = document.documentElement;
  root.toggleAttribute('data-shell-image', !!image);
  var file = imageName;
  if (file === undefined) try { file = sessionStorage.getItem('wudict_shell_image_name'); } catch (_) {}
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/.test(file || '')) file = '';
  root.style.setProperty('--paper-bk-image', image && file ? 'url("/files/' + file + '")' : 'none');
  try { root.toggleAttribute('data-desktop-image', !!image && !!file && sessionStorage.getItem('wudict_desktop_image') === '1'); } catch (_) {}
  // The paper an enabled PRESET paints, handed here by the app page: that page
  // paints this paper with its own layer and does not wear it as a shell
  // colour, while this document - no layers of its own - has nothing but the
  // host to give it a ground. It arrives with every call, and it is also kept
  // in wudict_shell_paper, because this page is reached by tapping a link and
  // so carries no shell parameters of its own. The READER's own colour wins
  // when there is one: that is the colour the app page paints as well.
  if (!/^#[0-9a-f]{6}$/i.test(color) && /^#[0-9a-f]{6}$/i.test(paper || '')) color = paper;
  var valid = /^#[0-9a-f]{6}$/i.test(color);
  root.toggleAttribute('data-shell-custom', valid || !!image);
  if (valid) {
    var rgb = color.slice(1).match(/../g).map(function (v) { return parseInt(v, 16); });
    root.setAttribute('data-shell-tone', rgb[0] * .299 + rgb[1] * .587 + rgb[2] * .114 > 160 ? 'light' : 'dark');
  } else root.removeAttribute('data-shell-tone');
  if (valid) root.style.setProperty('--bg', color, 'important');
  else root.style.removeProperty('--bg');
  try {
    if (image) sessionStorage.setItem('wudict_shell_image', '1');
    else sessionStorage.removeItem('wudict_shell_image');
    if (valid) sessionStorage.setItem('wudict_shell_bg', color);
    else sessionStorage.removeItem('wudict_shell_bg');
    if (/^#[0-9a-f]{6}$/i.test(paper || '')) sessionStorage.setItem('wudict_shell_paper', paper);
    else sessionStorage.removeItem('wudict_shell_paper');
  } catch (_) {}
};
(function () {
  var params = new URLSearchParams(location.search);
  var color = params.get('shell_bg');
  var image = params.get('shell_image');
  var paper = params.get('shell_paper');
  if (params.has('shell_bg') || params.has('shell_paper') || params.has('shell_image')) {
    params.delete('shell_bg');
    params.delete('shell_paper');
    params.delete('shell_image');
    var query = params.toString();
    history.replaceState(history.state, '', location.pathname + (query ? '?' + query : '') + location.hash);
  }
  if (color === null) {
    try { color = sessionStorage.getItem('wudict_shell_bg'); } catch (_) {}
  }
  if (image === null) {
    try { image = sessionStorage.getItem('wudict_shell_image'); } catch (_) {}
  }
  if (paper === null) {
    try { paper = sessionStorage.getItem('wudict_shell_paper'); } catch (_) {}
  }
  window.wudictShellBackground(color || '', image === '1', undefined, paper || '');
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{T:filters.title}}</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/setup.css?v={{CSS}}">
{{PRESETS}}
<script>
/* Standalone editor: read the font values saved by the reader's Settings. */
(function () {
  const defaults={title:1.15,addition:.9,hint:.8,controlHeight:1.6,hintControlHeight:1,
    editControlHeight:1.8,editControlFont:1,mainControlHeight:1.05,mainControlFont:1.05};
  const names={title:'--ui-font-title',addition:'--ui-font-addition',hint:'--ui-hint-font-size',
    controlHeight:'--ui-control-height',hintControlHeight:'--ui-hint-control-height',
    editControlHeight:'--ui-edit_control-height',editControlFont:'--ui-edit_control-font',
    mainControlHeight:'--ui-main-control-height',mainControlFont:'--ui-main-control-font'};
  let saved={};
  try { saved=JSON.parse(localStorage.getItem('wudict_settings_fonts')||'null')||{}; } catch (_) {}
  for(const [key,fallback] of Object.entries(defaults)){
    const value=Number(saved[key]),scale=Number.isFinite(value)?Math.min(key==='editControlHeight'||key==='controlHeight'?4:2,Math.max(.5,value)):fallback;
    document.documentElement.style.setProperty(names[key],String(scale));
  }
})();
</script>
<style>
/* Follow the host palette and let its wallpaper show through the editor. */
html[data-shell-image], html[data-shell-image] body { background:transparent !important; }
html[data-desktop-image] { background-color:var(--bg) !important;background-image:var(--paper-bk-image) !important;background-size:100% 100% !important;background-attachment:fixed !important; }
html[data-shell-custom] .card { background:rgba(255,255,255,.14); }
html[data-shell-custom] textarea,
html[data-shell-custom] code { background:rgba(255,255,255,.18); }
html[data-shell-custom] .acts button,
html[data-shell-custom] .acts .btn { background:rgba(255,255,255,.18);color:var(--fg);border:1px solid var(--line); }
html[data-shell-tone="light"] {
  color-scheme:light; --fg:#2b2a28; --soft:#625b4d; --faint:#766e60;
  --line:rgba(89,75,56,.4); --accent:#865000; --ok:#38603c; --err:#a3322c;
}
html[data-shell-tone="dark"] {
  color-scheme:dark; --fg:#f4f1eb; --soft:#ded8cc; --faint:#c6beaf;
  --line:rgba(230,220,201,.4); --accent:#ffc773; --ok:#aad3ad; --err:#ffb3ad;
}
/* Page-specific only; palette, card, buttons and typography are shared. The
   card is wider than the other pages' and the box takes most of the screen:
   this page is an editor, and the text is the whole of it. */
.card{max-width:760px;height:calc(100dvh - 2em);min-height:0;display:flex;flex-direction:column;overflow:auto}
/* The editor uses the same saved type and control scale as Settings. */
.top h1{font-size:calc(var(--ui-font-title) * 1rem)}
.top button.x{box-sizing:border-box;display:grid;place-items:center;flex:none;
  width:calc(var(--ui-main-control-height) * 1em);height:calc(var(--ui-main-control-height) * 1em);
  min-height:calc(var(--ui-main-control-height) * 1em);padding:0;
  font-size:calc(var(--ui-main-control-font) * 1rem);line-height:1}
.card>p:not(.note){font-size:calc(var(--ui-font-addition) * 1rem)}
.quiet code{box-sizing:border-box;display:inline-flex;align-items:center;
  min-height:calc(var(--ui-hint-control-height) * 1em);font-size:calc(var(--ui-hint-font-size) * 1rem)}
textarea{display:block;flex:1 1 auto;min-height:10em;width:100%;height:auto;margin:.618em 0 0;
  font:calc(var(--ui-font-addition) * 1rem)/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:.618em .8em;resize:vertical;outline:none;tab-size:4}
textarea:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.acts{display:flex;flex-wrap:wrap;gap:.5em;align-items:center;
  margin-top:calc(var(--ui-edit_control-height) * .75rem)}
.acts button{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
  height:calc(var(--ui-control-height) * 1em);min-height:calc(var(--ui-control-height) * 1em);
  margin-top:0;padding:0 1.2em;font-size:calc(var(--ui-font-addition) * 1rem)}
.acts #save{order:1;margin-left:auto;
  height:calc(var(--ui-edit_control-height) * 1.5rem);
  min-height:calc(var(--ui-edit_control-height) * 1.5rem);
  font-size:calc(var(--ui-edit_control-font) * 1rem)}
#msg,.probs,.note{font-size:calc(var(--ui-hint-font-size) * 1rem)}
#msg:empty,.probs:empty{display:none}
.note{color:var(--faint);margin:.2em 0 0;word-break:break-all}
.probs{margin:.382em 0 0;padding:0;list-style:none;color:var(--err)}
.probs code{color:var(--fg);font-size:inherit;word-break:normal;overflow-wrap:anywhere} /* breaks between words, a long one only if it must */
.quiet{color:var(--soft)}
.quiet code{white-space:nowrap;word-break:normal}
/* A phone: the text gets the width the card's padding would take, so a
   comment line of groups.ini fits on one row instead of wrapping into two. */
@media (max-width:520px){
  body{padding:.5em}
  .card{height:calc(100dvh - 1em);padding:1em .8em}
  textarea{padding:.5em .6em}
}
</style>
</head>
<body>
<div class="card">
<div class="top">
<h1>{{T:filters.title}}</h1>
<button type="button" class="x" id="closePage" aria-label="{{T:pages.close}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
</div>
<p>{{T:filters.hint}}</p>
<p class="quiet"><code>Mine = oxford, collins</code> &nbsp; <code>Mine = `^regex$`</code></p>

<textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
  aria-label="groups.ini"></textarea>
<div id="msg" role="status" aria-live="polite"></div>
<ul class="probs" id="probs"></ul>

<div class="acts">
  <button type="button" id="save">{{T:filters.save}}</button>
  <button type="button" class="ghost" id="reset">{{T:filters.reset}}</button>
</div>
<p class="note" id="file"></p>


</div>
<script>
"use strict";
const tx=window.wudictI18n.t;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* The server owns the file and parses it; this page shows its text, sends it
   back, and says what the save produced. "saved" is the text as the textarea
   itself returns it (it reads CRLF as LF, so a save writes LF), so a file
   written on Windows is not "changed" on arrival; "facets" is the server's parse of it, which is what a
   save is compared with. */
let saved="",facets=[],writable=false,unusable=false,busy=false;
const dirty=()=>$("text").value!==saved;

function say(text,cls){$("msg").className=cls||"";$("msg").textContent=text}

/* The groups a save added or changed - from the server's parse before and
   after, never from re-reading the text here. */
function edited(before,after){
  const was=new Map();
  for(const f of before)for(const g of f.groups)was.set(f.id+"\n"+g.id,g.items.join("\n"));
  const out=[];
  for(const f of after)for(const g of f.groups)
    if(was.get(f.id+"\n"+g.id)!==g.items.join("\n"))out.push({f:f.id,g});
  return out;
}

/* Of those, the ones no dictionary joined: a typo in a text or a regex looks
   exactly like that. Groups left as they were are not listed - a library
   without a Duden is not news. Counted on the same list the picker uses. */
async function unmatched(changed){
  if(!changed.length)return [];
  const have=new Set();
  try{
    const t=await (await fetch("/api/dicts")).text();
    for(const l of t.split("\n")){
      if(!l.trim())continue;
      const o=JSON.parse(l);
      if(o.t==="dict")for(const g of o.dict.filters||o.dict.groups||[])have.add(g.f+"\n"+g.v);
    }
  }catch(e){return []}
  return changed.filter(c=>!have.has(c.f+"\n"+c.g.id)).map(c=>c.g.label);
}

/* Problems are what the file means to the app and they are always shown: an
   invalid regular expression or a skipped line costs a group, silently,
   unless this list says so. */
function problems(j){
  $("probs").innerHTML=j.problems.map(p=>"<li>"+(p.line?tx("filters.line",{number:p.line})+": ":"")+esc(p.msg)+
    (p.text?" — <code>"+esc(p.text)+"</code>":"")+"</li>").join("");
  if(j.unusable)return tx("filters.fallback");
  const n=j.problems.reduce((n,p)=>n+(p.more||1),0);
  return n?tx("filters.problems",{number:n}):"";
}

function show(j,keepText){
  writable=j.writable;unusable=j.unusable;facets=j.facets;
  if(!keepText){$("text").value=j.text;saved=$("text").value}
  $("save").disabled=!writable;
  $("reset").classList.toggle("hidden",!j.custom||!writable);
  $("file").textContent=writable
    ?tx(j.custom?"filters.savedIn":"filters.createFile",{file:j.file})
    :tx("filters.noFolder");
  return problems(j);
}

async function call(method,body,query){
  const r=await fetch("/api/groups"+(query||""),{method,body,headers:body==null?{}:{"Content-Type":"text/plain; charset=utf-8"}});
  if(!r.ok){
    let why="HTTP "+r.status;
    try{const j=await r.json();if(j&&j.error)why=j.error}catch(_){}
    throw new Error(why);
  }
  return r.json();
}

async function load(){
  try{const p=show(await call("GET"));if(p)say(p,"err")}
  catch(e){say(tx("filters.unreachable",{error:e.message}),"err")}
}

async function save(){
  if(!writable||busy)return;
  /* A file the app cannot read is still the user's: the box was empty
     because it could not be shown, not because it is empty. */
  if(unusable&&!confirm(tx("filters.replace")))return;
  busy=true;$("save").disabled=true;say(tx("filters.saving"));
  const sent=$("text").value,before=facets;
  try{
    const j=await call("PUT",sent,unusable?"?replace=1":"");
    // typed while the save was in flight: keep it, it is not saved yet
    const typed=$("text").value!==sent;
    const p=show(j,typed);
    saved=typed?sent:$("text").value;
    const none=await unmatched(edited(before,j.facets));
    const parts=[tx("filters.saved")];
    if(p)parts.push(p);
    if(none.length)parts.push(tx("filters.unmatched",{names:none.join(", ")}));
    say(parts.join(" "),p||none.length?"err":"ok");
  }catch(e){say(tx("filters.saveFailed",{error:e.message}),"err")}
  finally{busy=false;$("save").disabled=!writable}
}

$("save").onclick=save;
$("reset").onclick=async()=>{
  if(busy||!confirm(tx("filters.resetConfirm")))return;
  try{show(await call("DELETE"));say(tx("filters.restored"),"ok")}
  catch(e){say(tx("filters.resetFailed",{error:e.message}),"err")}
};
$("text").addEventListener("input",()=>{if($("msg").className!=="err")say("")});
addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}
});
addEventListener("beforeunload",e=>{if(dirty()){e.preventDefault();e.returnValue=""}});
$("closePage").onclick=()=>{
  if(dirty()&&!confirm(tx("filters.leave")))return;
  saved=$("text").value;
  if(history.length>1)history.back();
  else location.href="/";
};
load();
</script>
</body>
</html>
