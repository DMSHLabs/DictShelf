name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Source branch to build"
        type: choice
        options:
          - releases
          - dev
        default: releases
        required: true
      tag:
        description: "Release tag (e.g. dictshelf-v1.02.01); blank = generate from the selected channel"
        required: false
      channel:
        description: "Release channel"
        type: choice
        options:
          - release
          - pre-release
          - beta
        default: release
      draft:
        description: "Create the release as a draft (nothing is downloadable until it is published)"
        type: boolean
        default: false
      publish_release:
        description: "Publish build assets to a GitHub Release (otherwise keep them as Actions artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: WebView2 desktop and installer
    runs-on: windows-2022
    steps:
      - name: Checkout releases branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout the version resolver from this workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          sparse-checkout: tools/next-tag.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure GCC for the build script
        shell: pwsh
        run: |
          $gcc = 'C:\mingw64\bin\gcc.exe'
          if (-not (Test-Path -LiteralPath $gcc)) { throw "GitHub's windows-2022 GCC is missing: $gcc" }
          & $gcc --version | Select-Object -First 1
          & $gcc -dumpmachine
          "GCC_PATH=$gcc" >> $env:GITHUB_ENV
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $gcc)

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $iscc = .\tools\make-installer.ps1 -Locate
          if ($iscc) {
            Write-Host "Inno Setup: $iscc"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Compute version
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(sh .workflow-source/tools/next-tag.sh --${{ inputs.channel }})"
          fi
          # Stamp the desktop executable with the tag that this release will
          # carry. The installer later reads its identity and version from it.
          echo "WUDICT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building $VERSION"

      - name: Build desktop executable
        shell: cmd
        run: build-windows.cmd

      - name: Build command-line executable
        shell: cmd
        run: build-windows.cmd cli

      - name: Build HTTP server executable
        shell: cmd
        run: build-windows.cmd server

      - name: Build installer from desktop executable
        shell: cmd
        run: build-windows.cmd installer

      - name: Upload WebView2 executable
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-windows-x64
          path: DictShelf.exe
          if-no-files-found: error

      - name: Upload command-line executable
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-windows-cli-x64
          path: DictShelf-cli.exe
          if-no-files-found: error

      - name: Upload HTTP server executable
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-windows-server-x64
          path: DictShelf-server.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-installer
          path: dist/dictshelf-windows-x64-setup*.exe
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout releases branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Checkout the version resolver from this workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          sparse-checkout: tools/next-tag.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # Blank field: tools/next-tag.sh decides, and it decides the same
            # tag the build job stamped above (D168) - both read the same
            # clone, and neither creates anything, so the two agree.
            TAG="$(sh .workflow-source/tools/next-tag.sh --${{ inputs.channel }})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create git tag if missing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          # Without this the release step would let `gh release create` mint
          # the tag itself, and it mints it on the repository's DEFAULT branch
          # rather than on the commit built here. A tag on another commit is a
          # version line the next workflow of this release reads as moved, so
          # it would bump past it and split the release in two.
          # --exit-code with the full ref, not `| grep -q "$TAG"`: an unanchored
          # grep for "v0.1" matches an existing "v0.10".
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # The message keeps the shape of every hand-made tag in this
            # repository (wuDict2 v0.11.1), so the two are one line in a log.
            git tag -a "${TAG}" -m "DictShelf ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FLAGS=()
          [ "${{ inputs.channel }}" != "release" ] && FLAGS+=(--prerelease)
          [ "${{ inputs.draft }}" = "true" ] && FLAGS+=(--draft)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing Windows assets."
            gh release upload "${TAG}" artifacts/* --clobber
            if [ ${#FLAGS[@]} -gt 0 ]; then
              gh release edit "${TAG}" "${FLAGS[@]}"
            fi
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" artifacts/* \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes "${FLAGS[@]}"
          fi

      - name: Checkout dev for the public update catalogue
        if: ${{ inputs.draft == false }}
        uses: actions/checkout@v6
        with:
          ref: dev
          path: .update-catalog
          fetch-depth: 0

      - name: Refresh static update catalogue
        if: ${{ inputs.draft == false }}
        run: |
          set -euo pipefail
          export UPDATE_CATALOG_PATH=.update-catalog/update-catalog.json
          gh api --paginate repos/DMSHLabs/DictShelf/releases --jq '.[]' | jq -s '.' | python3 .update-catalog/tools/update-catalog.py
          sh .update-catalog/tools/publish-update-catalog.sh .update-catalog/update-catalog.json
