name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Source branch to build"
        type: choice
        options:
          - releases
          - dev
        default: releases
        required: true
      tag:
        description: "Tag for the release (e.g., v0.1); blank = use latest tag"
        required: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (nothing is downloadable until it is published)"
        type: boolean
        default: false
      publish_release:
        description: "Publish build assets to a GitHub Release (otherwise keep them as Actions artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: WebView2 desktop and installer
    runs-on: windows-2022
    steps:
      - name: Checkout releases branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $iscc = .\tools\make-installer.ps1 -Locate
          if ($iscc) {
            Write-Host "Inno Setup: $iscc"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Build executable and installer
        shell: cmd
        run: build-windows.cmd installer

      - name: Upload WebView2 executable
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-x64
          path: wuDict2.exe
          if-no-files-found: error

      - name: Upload command-line executable
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-cli-x64
          path: wuDict2-cli.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-installer
          path: dist/wudict2-windows-x64-setup*.exe
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout releases branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "::error::No tag input and no existing git tag to fall back on." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FLAGS=()
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS+=(--prerelease)
          [ "${{ inputs.draft }}" = "true" ] && FLAGS+=(--draft)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing Windows assets."
            gh release upload "${TAG}" artifacts/* --clobber
            if [ ${#FLAGS[@]} -gt 0 ]; then
              gh release edit "${TAG}" "${FLAGS[@]}"
            fi
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" artifacts/* \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes "${FLAGS[@]}"
          fi
