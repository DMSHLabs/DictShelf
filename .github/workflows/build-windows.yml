name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Source branch to build"
        type: choice
        options:
          - releases
          - dev
        default: releases
        required: true
      tag:
        description: "Release tag (e.g. wudict2-v0.12.0); blank = next version: +0.0.1 for a pre-release, +0.1.0 for a release"
        required: false
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft (nothing is downloadable until it is published)"
        type: boolean
        default: false
      publish_release:
        description: "Publish build assets to a GitHub Release (otherwise keep them as Actions artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: WebView2 desktop and installer
    runs-on: windows-2022
    steps:
      - name: Checkout releases branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Setup MinGW-w64 GCC
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Configure GCC for the build script
        shell: pwsh
        run: |
          $gcc = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin\gcc.exe'
          "GCC_PATH=$gcc" >> $env:GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $iscc = .\tools\make-installer.ps1 -Locate
          if ($iscc) {
            Write-Host "Inno Setup: $iscc"
          } else {
            choco install innosetup -y --no-progress
          }

      - name: Compute version
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            # The same rule the release job below applies (D168): a
            # pre-release takes the next patch, a release the next minor, and
            # a workflow that already published this release keeps its tag.
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              VERSION="$(sh tools/next-tag.sh --prerelease)"
            else
              VERSION="$(sh tools/next-tag.sh --release)"
            fi
          fi
          # Stamp the desktop executable with the tag that this release will
          # carry. The installer later reads its identity and version from it.
          echo "WUDICT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building $VERSION"

      - name: Build desktop executable
        shell: cmd
        run: build-windows.cmd

      - name: Build command-line executable
        shell: cmd
        run: build-windows.cmd cli

      - name: Build HTTP server executable
        shell: cmd
        run: build-windows.cmd server

      - name: Build installer from desktop executable
        shell: cmd
        run: build-windows.cmd installer

      - name: Upload WebView2 executable
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-x64
          path: wuDict2.exe
          if-no-files-found: error

      - name: Upload command-line executable
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-cli-x64
          path: wuDict2-cli.exe
          if-no-files-found: error

      - name: Upload HTTP server executable
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-server-x64
          path: wuDict2-server.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-installer
          path: dist/wudict2-windows-x64-setup*.exe
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout releases branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # Blank field: tools/next-tag.sh decides, and it decides the same
            # tag the build job stamped above (D168) - both read the same
            # clone, and neither creates anything, so the two agree.
            if [ "${{ inputs.prerelease }}" = "true" ]; then
              TAG="$(sh tools/next-tag.sh --prerelease)"
            else
              TAG="$(sh tools/next-tag.sh --release)"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create git tag if missing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          # Without this the release step would let `gh release create` mint
          # the tag itself, and it mints it on the repository's DEFAULT branch
          # rather than on the commit built here. A tag on another commit is a
          # version line the next workflow of this release reads as moved, so
          # it would bump past it and split the release in two.
          # --exit-code with the full ref, not `| grep -q "$TAG"`: an unanchored
          # grep for "v0.1" matches an existing "v0.10".
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # The message keeps the shape of every hand-made tag in this
            # repository (wuDict2 v0.11.1), so the two are one line in a log.
            git tag -a "${TAG}" -m "wuDict2 ${TAG#wudict2-}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          FLAGS=()
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS+=(--prerelease)
          [ "${{ inputs.draft }}" = "true" ] && FLAGS+=(--draft)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing Windows assets."
            gh release upload "${TAG}" artifacts/* --clobber
            if [ ${#FLAGS[@]} -gt 0 ]; then
              gh release edit "${TAG}" "${FLAGS[@]}"
            fi
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" artifacts/* \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes "${FLAGS[@]}"
          fi
