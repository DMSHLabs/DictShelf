# The correctness gate
#
# Both flavours are covered, because they are different products: the cgo
# build links mattn/go-sqlite3 and the built-in Speex decoder, the purego build
# links modernc's driver (D4, D18, D29). A change can pass one and fail the
# other.
#
# And all three desktop systems, because they are different too: Windows
# refuses to rename over or delete an open file and checks text out with CRLF
# unless told otherwise; macOS resolves /var to /private/var. Each of those has
# shipped a bug that only its own system could see, so each runs the suite.
name: test

on:
  push:
    branches: [master]
    # The documentation site cannot break the Go build. It has its own gate.
    paths-ignore:
      - 'pages/**'
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same branch has nothing left to say.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # tidy + vet + the whole test suite, cgo flavour. This is also what
      # asserts the OpenAPI document against the server's route table, which is
      # why docs.yml does not have to.
      #
      # Integration tests skip themselves when WUDICT_TEST_* points at nothing,
      # so no dictionary fixtures are needed here.
      - name: make check
        run: make check

      # `make check` RUNS `go mod tidy`; CI must not accept a repository that
      # only becomes correct after being modified. If tidy changed anything,
      # the commit was untidy.
      - name: go.mod and go.sum are tidy
        run: git diff --exit-code -- go.mod go.sum

      # Release parity (D4): the pure-Go driver must keep passing, and the
      # tag-less build must keep working, because `go install` produces it.
      - name: purego flavour
        run: |
          make test-purego
          go build -tags purego ./...
          go build ./...

  # The same suite on macOS and Windows, on the images the release binaries
  # are built on (build-cgo.yml), so a test passing here is about the system
  # users run. Repository-wide checks (tidy) stay with the job above: their
  # answer does not depend on the system.
  #
  # `go` directly, not `make`: the Windows image has no GNU make, and the
  # Makefile assumes a POSIX shell. The commands are the ones `make vet`,
  # `make test` and `make test-purego` run - keep them in step.
  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # one system failing must not hide whether the other one passes
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # cgo flavour; the C toolchain is preinstalled on both images (Xcode
      # clang, MinGW-w64 gcc).
      - name: vet
        env:
          CGO_ENABLED: "1"
        run: go vet -tags sqlite_fts5 ./...

      - name: test
        env:
          CGO_ENABLED: "1"
        run: go test -tags sqlite_fts5 -trimpath ./...

      - name: purego flavour
        env:
          CGO_ENABLED: "0"
        run: |
          go test -tags purego ./internal/store/ ./internal/server/
          go build -tags purego ./...
