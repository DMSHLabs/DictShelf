# Android APK: cross-compile the cgo Android Go/JNI bridges for both ARM ABIs,
# then package arm64-v8a, armeabi-v7a and universal FOSS release APKs.
# The NDK version is pinned here; the Makefile auto-detects it locally.
#
# Secrets required for a signed release build.
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore
#   ANDROID_KEYSTORE_PASSWORD  store password
#   KEY_ALIAS                  key alias inside the store
#   KEY_PASSWORD               key password

name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. dictshelf-v1.02.01); blank = generate from the selected channel"
        required: false
      channel:
        description: "Release channel"
        type: choice
        options:
          - release
          - pre-release
          - beta
        default: release
      draft:
        description: "Create the release as a draft (nothing is downloadable until it is published)"
        type: boolean
        default: false
      publish_release:
        description: "Publish the APK to a GitHub Release (otherwise keep it as an Actions artifact)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0 # versionName and versionCode both come from git history

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default is `tools platform-tools`, and `tools` - the
          # old SDK Tools package - was retired from Google's repository, so
          # the default now fails outright with "Failed to find package
          # 'tools'". Nothing here ever needed it: the step below installs
          # exactly what the build uses, by name and version.
          packages: ""

      - name: Install platform, build-tools and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"

      - name: Compute version
        id: ver
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(sh tools/next-tag.sh --${{ inputs.channel }})"
          fi

          # versionCode is NOT passed: app/build.gradle derives it from commits
          # after its checked-in baseline, so local and CI builds of the same
          # workflow agree on it. Passing it here too would be a second source
          # of truth, which is how they came to disagree in the first place.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$VERSION" >> "$GITHUB_ENV"
          echo "building $VERSION (versionCode derived from Android baseline)"

      - name: Build Go/JNI bridges for ARM ABIs
        run: |
          set -euo pipefail
          build_bridge() {
            local goarch="$1" goarm="$2" target="$3" abi="$4"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            CGO_ENABLED=1 GOOS=android GOARCH="$goarch" GOARM="$goarm" \
              CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --target=${target}" \
              CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++ --target=${target}" \
              go build -buildmode=c-shared -tags sqlite_fts5 -trimpath \
                -ldflags "-s -w -extldflags=-Wl,-z,max-page-size=16384" \
                -o "android/app/src/main/jniLibs/$abi/libwudictbridge.so" ./android/nativebridge
          }
          build_bridge arm64 '' aarch64-linux-android26 arm64-v8a
          build_bridge arm 7 armv7a-linux-androideabi26 armeabi-v7a

      - name: Configure signing
        id: signing
        run: |
          if [ -z "$KS_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::signing secrets incomplete - building unsigned release APKs"
            exit 0
          fi
          KS="$RUNNER_TEMP/wudict.keystore"
          echo "$KS_B64" | base64 -d > "$KS"

          # Prove the store opens and the alias exists BEFORE Gradle runs.
          # These are the two things people get wrong, and Gradle reports both
          # as an opaque failure at the very end of a five-minute build.
          keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

          # KEYSTORE must be a PATH - build.gradle does file(System.getenv("KEYSTORE")).
          echo "KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: |
          cd android
          # Only the FOSS flavour is published here (D62). The Play bundle is
          # built locally with `make aab-play` and signed with Play's UPLOAD
          # key, which is not this workflow's keystore.
          # Stamp the selected version and restrict each APK to its advertised
          # ABI. Stage each file immediately because Gradle replaces the prior
          # APK in foss/release on the next assemble invocation.
          OUT=app/build/outputs/apk/foss/release
          STAGE=app/build/outputs/apk/all
          mkdir -p "$STAGE"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then SUFFIX=""; else SUFFIX="-unsigned"; fi
          ./gradlew --no-daemon assembleFossRelease \
            -PversionName="${{ steps.ver.outputs.version }}" -PandroidAbis=arm64-v8a -PapkAbiName=arm64-v8a
          cp "$OUT/dictshelf-android-arm64-v8a-foss$SUFFIX.apk" "$STAGE/"
          ./gradlew --no-daemon assembleFossRelease \
            -PversionName="${{ steps.ver.outputs.version }}" -PandroidAbis=armeabi-v7a -PapkAbiName=armeabi-v7a
          cp "$OUT/dictshelf-android-armeabi-v7a-foss$SUFFIX.apk" "$STAGE/"
          ./gradlew --no-daemon assembleFossRelease \
            -PversionName="${{ steps.ver.outputs.version }}" -PandroidAbis=arm64-v8a,armeabi-v7a -PapkAbiName=universal
          cp "$OUT/dictshelf-android-universal-foss$SUFFIX.apk" "$STAGE/"

      - name: Assert Android APK permissions and no-server boundary
        # Play must omit storage access, FOSS must retain All-files access,
        # and neither APK may carry the listen-address control.
        run: sh tools/verify-apk.sh

      - name: Locate the APK
        run: |
          # No renaming here any more. app/build.gradle names the APK
          # (androidComponents.onVariants) and the Makefile exports the path,
          # so the published asset, `make apk-foss-release` and dist/ all carry
          # ONE name: dictshelf-android-arm64-v8a-foss.apk. The old copy step
          # invented a second name (wudict-android-arm64.apk) that said nothing
          # about the flavour and existed nowhere else in the project.
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            SUFFIX=""
          else
            SUFFIX="-unsigned"
          fi
          OUT=android/app/build/outputs/apk/all
          APK_ARM64="$OUT/dictshelf-android-arm64-v8a-foss$SUFFIX.apk"
          APK_ARMV7="$OUT/dictshelf-android-armeabi-v7a-foss$SUFFIX.apk"
          APK_UNIVERSAL="$OUT/dictshelf-android-universal-foss$SUFFIX.apk"
          for APK in "$APK_ARM64" "$APK_ARMV7" "$APK_UNIVERSAL"; do
            if [ ! -f "$APK" ]; then
              echo "expected $APK - Gradle produced:"
              find android/app/build/outputs/apk -name '*.apk' -print
              exit 1
            fi
          done
          echo "APK_ARM64=$APK_ARM64" >> "$GITHUB_ENV"
          echo "APK_ARMV7=$APK_ARMV7" >> "$GITHUB_ENV"
          echo "APK_UNIVERSAL=$APK_UNIVERSAL" >> "$GITHUB_ENV"
          echo "publishing all three ABI APKs"

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-android-release-apks
          path: |
            ${{ env.APK_ARM64 }}
            ${{ env.APK_ARMV7 }}
            ${{ env.APK_UNIVERSAL }}

      - name: Create git tag if missing
        if: ${{ inputs.publish_release && steps.signing.outputs.enabled == 'true' }}
        run: |
          # --exit-code with the full ref, not `| grep -q "$TAG"`: an unanchored
          # grep for "v0.1" matches an existing "v0.10" and silently skips
          # creating the tag that was actually asked for.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # The message keeps the shape of every hand-made tag in this
            # repository (wuDict2 v0.11.1), so the two are one line in a log.
            git tag -a "${TAG}" -m "DictShelf ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      - name: Create or update GitHub release
        if: ${{ inputs.publish_release && steps.signing.outputs.enabled == 'true' }}
        # The channel and draft selection apply when the release is CREATED;
        # on one that already exists they are only ever ADDED, never cleared.
        # Three workflows publish into the same tag, so the second to arrive
        # must not un-draft what the first staged, and a re-upload of assets
        # onto an older release must not strip its pre-release marker.
        run: |
          FLAGS=()
          [ "${{ inputs.channel }}" != "release" ] && FLAGS+=(--prerelease)
          [ "${{ inputs.draft }}" = "true" ] && FLAGS+=(--draft)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing assets."
            gh release upload "${TAG}" "$APK_ARM64" "$APK_ARMV7" "$APK_UNIVERSAL" --clobber
            # An `if`, not a trailing `&&`: this is the last command in the
            # branch, so a false test would become the step's exit status.
            if [ ${#FLAGS[@]} -gt 0 ]; then
              gh release edit "${TAG}" "${FLAGS[@]}"
            fi
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" "$APK_ARM64" "$APK_ARMV7" "$APK_UNIVERSAL" \
              --title "${{ github.event.repository.name }} ${TAG}" \
              --generate-notes "${FLAGS[@]}"
          fi

      - name: Refresh static update catalogue
        if: ${{ inputs.publish_release && steps.signing.outputs.enabled == 'true' && inputs.draft == false }}
        run: |
          set -euo pipefail
          gh api --paginate repos/DMSHLabs/DictShelf/releases --jq '.[]' | jq -s '.' | python3 tools/update-catalog.py
          sh tools/publish-update-catalog.sh update-catalog.json
