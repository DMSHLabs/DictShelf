name: Build+Release (cgo)

# Performance-optimized builds using the cgo mattn/go-sqlite3 driver
# (-tags sqlite_fts5, CGO_ENABLED=1). Unlike build-release.yml (pure-Go
# modernc cross-compiled from one ubuntu box), each target is built on its
# OWN native runner because cgo cannot cross the host arch/OS. Produces
# workflow artifacts by default; the explicit publish_release input can add
# these cgo assets to a GitHub Release.
#
# C toolchains are preinstalled on the Linux and macOS GitHub-hosted images
# (actions/runner-images): Ubuntu → gcc, macOS → Xcode/clang. Windows is built
# separately through build-windows.cmd so its artifacts include WebView2.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. dictshelf-v1.02.01); blank = generate from the selected channel"
        required: false
      channel:
        description: "Release channel"
        type: choice
        options:
          - release
          - pre-release
          - beta
        default: release
      draft:
        description: "Create the release as a draft (nothing is downloadable until it is published)"
        type: boolean
        default: false
      publish_release:
        description: "Publish build assets to a GitHub Release (otherwise keep them as Actions artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux (native gcc) ────────────────────────────────
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          # ── macOS (Apple-Silicon runner; amd64 via arch flag) ─
          - { runner: macos-14, goos: darwin, goarch: arm64 }
          - {
              runner: macos-14,
              goos: darwin,
              goarch: amd64,
              cc: "clang -arch x86_64",
            }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: releases
          fetch-depth: 0

      - name: Checkout the version resolver from this workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          sparse-checkout: tools/next-tag.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }} # empty ⇒ Go's default compiler for the host
        run: |
          BINARY="wudict-${{ matrix.goos }}-${{ matrix.goarch }}-cgo${{ matrix.ext }}"
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            # Blank field: the rule the release job below applies (D168) -
            # a pre-release takes the next patch, a release the next minor,
            # and a release another workflow already started keeps its tag -
            # so the binary is stamped with the version its release carries.
            VERSION="$(sh .workflow-source/tools/next-tag.sh --${{ inputs.channel }})"
          fi
          # Fail loudly instead of silently shipping 0.0.0 artifacts. The
          # Both current DictShelf tags and legacy tags count as versions.
          case "$VERSION" in
            v[0-9]*|dictshelf-v[0-9]*|wudict2-v[0-9]*|[0-9]*) : ;;
            *) echo "::warning title=Unversioned build::no usable tag found - stamping '$VERSION'; installers will be named 0.0.0" ;;
          esac
          echo "version: $VERSION"
          # Pin the native target; Finder enforces LC_BUILD_VERSION per slice.
          if [ "${{ matrix.goos }}" = darwin ]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
            export CGO_CFLAGS="-O2 -g -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
            export CGO_LDFLAGS="$CGO_CFLAGS"
          fi
          go build -trimpath -tags sqlite_fts5 \
            -ldflags="-s -w -X github.com/DMSHLabs/DictShelf/internal/cli.Version=${VERSION}" \
            -o "${BINARY}" .

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: wudict-${{ matrix.goos }}-${{ matrix.goarch }}-cgo
          path: wudict-${{ matrix.goos }}-${{ matrix.goarch }}-cgo${{ matrix.ext }}

  # The double-clickable macOS app (D75). One UNIVERSAL bundle rather than one
  # per chip: the point of an .app is that nobody has to know what a chip is.
  # Version and name come from the binary itself (`wudict --version`), so this
  # job stamps nothing and cannot drift from the build job above.
  macos-app:
    name: macOS .app (universal)
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: releases

      - name: Download the darwin binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: wudict-darwin-*-cgo
          merge-multiple: true

      - name: Fuse the slices and build the bundle
        shell: bash
        run: |
          set -eu
          slices=$(ls artifacts/wudict-darwin-*-cgo 2>/dev/null || true)
          if [ -z "$slices" ]; then
            echo "::warning title=No .app::no darwin binaries were produced - skipping the bundle"
            exit 0
          fi
          # lipo -create accepts a single input, so a half-failed matrix still
          # yields a usable (thin) app instead of no app at all.
          lipo -create -output wudict $slices
          chmod +x wudict
          lipo -info wudict
          APP_BIN="$PWD/wudict" BUILD_DIR="$PWD/dist" sh tools/make-app.sh
          # ditto, not zip: it is the only archiver Apple guarantees keeps the
          # bundle's symlinks, xattrs and code signature intact.
          # Versioned like every other asset (dictshelf-windows-x64-setup-3.7.5.exe),
          # from the binary's own --version via the same helper make-app.sh
          # used, so the zip and the bundle inside it cannot disagree. Same
          # file-name rules as the APK: leading "v" dropped, "/" -> "_".
          eval "$(sh tools/version.sh ./wudict)"
          ZIPVER=$(printf '%s' "${WUDICT_VERSION#v}" | tr '/' '_')
          ditto -c -k --keepParent "$(cat dist/.app-path)" "wudict-macos-universal-app-${ZIPVER}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wudict-macos-app
          path: wudict-macos-universal-app-*.zip
          if-no-files-found: warn

  # Windows desktop and console CLI binaries are built separately.
  windows-installer:
    name: Windows desktop and installer
    # Build on the native Windows runner through the same entry point used
    # locally. That embeds the fork's WebView2 window in DictShelf.exe before the
    # installer packages it; packaging the upstream-style CLI artifact from
    # the matrix build would omit the desktop shell.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: releases
          fetch-depth: 0

      - name: Checkout the version resolver from this workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          sparse-checkout: tools/next-tag.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Configure GCC for the build script
        shell: pwsh
        run: |
          $gcc = 'C:\mingw64\bin\gcc.exe'
          if (-not (Test-Path -LiteralPath $gcc)) { throw "GitHub's windows-2022 GCC is missing: $gcc" }
          & $gcc --version | Select-Object -First 1
          & $gcc -dumpmachine
          "GCC_PATH=$gcc" >> $env:GITHUB_ENV
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $gcc)

      - name: Compute version
        shell: bash
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then
            # The version this release carries (D168), the same one the build
            # job stamps the binaries with and the release job tags it as.
            VERSION="$(sh .workflow-source/tools/next-tag.sh --${{ inputs.channel }})"
          fi
          # build-windows.cmd would otherwise name the setup file and its
          # VersionInfo after the clone's last tag, which is the PREVIOUS
          # release the moment the field above was blank or new.
          echo "WUDICT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "building $VERSION"

      - name: Build WebView2 desktop executable
        shell: cmd
        run: build-windows.cmd

      - name: Build command-line executable
        shell: cmd
        run: build-windows.cmd cli

      - name: Build HTTP server executable
        shell: cmd
        run: build-windows.cmd server

      - name: Build installer from desktop executable
        shell: cmd
        run: build-windows.cmd installer

      - name: Upload desktop executable
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-windows-x64
          path: DictShelf.exe

      - name: Upload command-line executable
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-windows-cli-x64
          path: DictShelf-cli.exe
          if-no-files-found: error

      - name: Upload HTTP server executable
        uses: actions/upload-artifact@v7
        with:
          name: dictshelf-windows-server-x64
          path: DictShelf-server.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: wudict2-windows-installer
          path: dist/dictshelf-windows-x64-setup*.exe
          if-no-files-found: error

  release:
    if: ${{ inputs.publish_release }}
    needs: [build, macos-app, windows-installer]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: releases
          fetch-depth: 0 # full history + tags so tools/next-tag.sh can pick the version
          persist-credentials: true

      - name: Checkout the version resolver from this workflow revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-source
          sparse-checkout: tools/next-tag.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            # Blank field: tools/next-tag.sh decides, the same rule the build
            # job stamped the binaries with (D168). Both read the same clone
            # and neither creates anything, so the two cannot disagree.
            TAG="$(sh .workflow-source/tools/next-tag.sh --${{ inputs.channel }})"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create git tag if missing
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Without this the release step would let `gh release create` mint
          # the tag itself, and it mints it on the repository's DEFAULT branch
          # rather than on the commit built here. A tag on another commit is a
          # version line the next workflow of this release reads as moved, so
          # it would bump past it and split the release in two.
          # --exit-code with the full ref, not `| grep -q "$TAG"`: an unanchored
          # grep for "v0.1" matches an existing "v0.10".
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag ${TAG} already exists - skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # The message keeps the shape of every hand-made tag in this
            # repository (wuDict2 v0.11.1), so the two are one line in a log.
            git tag -a "${TAG}" -m "DictShelf ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} pushed."
          fi

      # Notes are rendered from the commit history by cliff.toml, through the
      # same tools/release-notes.sh that `make release-notes TAG=v3.8.0` runs -
      # so what CI publishes is what you read before tagging. The script is
      # built never to fail: a missing git-cliff, an empty range, a commit
      # nobody could parse, all end as empty output and exit 0. Empty is read
      # here as "let GitHub write them", never as a reason to sink the run.
      - name: Render release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          sh tools/release-notes.sh "$TAG" > notes.md 2> notes.log || true
          cat notes.log || true
          # The OUTPUT decides, not the exit status: git-cliff renders a bare
          # "[unreleased]" heading and exits 0 when a range holds no commits,
          # and a release published with blank notes is the failure this
          # check exists to prevent.
          if grep -q '^- ' notes.md 2>/dev/null; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "--- release notes ---"; cat notes.md
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=No changelog::git-cliff produced no entries for ${TAG} - falling back to GitHub's generated notes"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        # The two dispatch checkboxes. They apply when the release is CREATED;
        # on one that already exists they are only ever ADDED, never cleared.
        # Three workflows publish into the same tag, so the second to arrive
        # must not un-draft what the first staged, and a re-upload of assets
        # onto an older release must not strip its pre-release marker.
        run: |
          FLAGS=()
          [ "${{ inputs.channel }}" != "release" ] && FLAGS+=(--prerelease)
          [ "${{ inputs.draft }}" = "true" ] && FLAGS+=(--draft)
          # This workflow OWNS the notes: it sets them on a release it finds
          # as well as on one it creates. Three workflows publish into the
          # same tag, so leaving the notes to whoever arrived first would make
          # the release page read differently depending on which matrix
          # finished faster. The two dispatch checkboxes stay add-only for
          # exactly the opposite reason - a later upload must not un-draft or
          # un-prerelease what an earlier one deliberately staged.
          NOTES=()
          [ "${{ steps.notes.outputs.have }}" = "1" ] && NOTES+=(--notes-file notes.md)
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} exists - replacing native assets."
            gh release upload "${TAG}" artifacts/* --clobber
            EDIT=("${NOTES[@]}" "${FLAGS[@]}")
            # An `if`, not a trailing `&&`: this is the last command in the
            # branch, so a false test would become the step's exit status.
            if [ ${#EDIT[@]} -gt 0 ]; then
              gh release edit "${TAG}" "${EDIT[@]}"
            fi
          else
            echo "Creating release ${TAG}."
            # --generate-notes only when cliff gave us nothing; the two are
            # mutually exclusive and GitHub's is the fallback, not the default.
            [ ${#NOTES[@]} -eq 0 ] && NOTES=(--generate-notes)
            gh release create "${TAG}" artifacts/* \
              --title "${{ github.event.repository.name }} ${TAG}" \
              "${NOTES[@]}" "${FLAGS[@]}"
          fi

      - name: Checkout dev for the public update catalogue
        if: ${{ inputs.draft == false }}
        uses: actions/checkout@v6
        with:
          ref: dev
          path: .update-catalog
          fetch-depth: 0

      - name: Refresh static update catalogue
        if: ${{ inputs.draft == false }}
        run: |
          set -euo pipefail
          export UPDATE_CATALOG_PATH=.update-catalog/update-catalog.json
          gh api --paginate repos/DMSHLabs/DictShelf/releases --jq '.[]' | jq -s '.' | python3 .update-catalog/tools/update-catalog.py
          sh .update-catalog/tools/publish-update-catalog.sh .update-catalog/update-catalog.json
